<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D6B35">
<meta name="description" content="모둠이 함께 적는 활동지예요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="체험첵! Field-Check!">
<meta property="og:title" content="체험첵! 모둠 활동지">
<meta property="og:description" content="모둠이 함께 적는 활동지예요.">
<meta property="og:url" content="https://musicalpe.github.io/Field-Check/sheet.html">
<meta property="og:image" content="https://musicalpe.github.io/Field-Check/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<title>체험첵! 모둠 활동지</title>
<link rel="icon" href="favicon-32.png">
<script>
/* 카카오톡 안 브라우저는 구글 로그인이 막히고 저장이 불안정해서, 휴대폰 기본 브라우저로 넘김 */
(function(){
  if (!/KAKAOTALK/i.test(navigator.userAgent)) return;
  try{ if (sessionStorage.getItem("kakao-out")) return; sessionStorage.setItem("kakao-out", "1"); }catch(e){}
  window.__kakaoOut = true;
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
})();
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF; --acc:#D9A23A; --acc-soft:#FBF1DC;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3; --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif; --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812; --acc:#F0BE5A; --acc-soft:#3A2F17;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420; --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 360px) no-repeat,var(--bg)}
main{max-width:620px;margin:0 auto;padding:20px 16px 60px}
.top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#1d3a18));color:var(--on-pri);border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;background:url(icon-180.png) center/cover;border-radius:24px;opacity:.22;transform:rotate(-10deg)}
.top .ev{font-size:14px;opacity:.85}
.top h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.2}
.top .grp{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px}
.top p{margin:8px 0 0;font-size:14px;opacity:.92}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 4px 16px var(--shadow)}
.n{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:13px;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.t{font-weight:800;margin-bottom:10px;word-break:keep-all}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:var(--ink);background:var(--soft);resize:vertical}
textarea:focus{outline:none;border-color:var(--pri);background:var(--card)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.choice.on{border-color:var(--pri);background:var(--pri-soft);font-weight:800;color:var(--pri)}
.gpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gpick button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 8px;font:inherit;font-weight:800;cursor:pointer}
.submit{width:100%;border:0;background:var(--pri);color:var(--on-pri);font:inherit;font-weight:900;font-size:19px;padding:16px;border-radius:999px;cursor:pointer;margin-top:6px;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 25%,transparent)}
.submit:disabled{opacity:.6}
.state{text-align:center;font-size:14px;color:var(--sub);margin-top:10px;min-height:20px}
.state.ok{color:var(--ok);font-weight:800}
.state.err{color:var(--warn)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 22px;text-align:center;margin-top:30px}
.msg .big{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
.msg h2{font-family:var(--f-display);font-weight:400;margin:0 0 8px;font-size:24px}
.msg p{margin:0;color:var(--sub)}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;display:block;margin:12px auto 0}
</style>
</head>
<body>
<main id="app"><div class="msg"><p>활동지를 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p = new URLSearchParams(location.search);
const eid = p.get('e'), hid = p.get('h');
let gid = p.get('g'), uid = null, sh = null, groups = [], answers = {}, savedAt = null;
const DKEY = () => `fieldcheck-sheet-${eid}-${hid}-${gid}`;

function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}
const atText = a => { const t = a && a.at && (a.at.toMillis ? a.at.toMillis() : a.at); if (!t) return ''; const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };

async function boot() {
  if (!eid || !hid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    uid = await S.studentLogin();
    step = '활동지 읽기';
    sh = await S.getSheet(eid, hid);
    if (!sh) return message('?', '활동지를 찾을 수 없어요', '선생님께 QR을 다시 확인해 달라고 해 주세요.');
    groups = Object.entries(sh.groups || {}).map(([id, g]) => ({ id, ...g })).sort((a, b) => (a.order || 0) - (b.order || 0));
    if (gid && !sh.groups[gid]) gid = null;
    if (!gid) return pickGroup();
    await loadGroup();
  } catch (e) {
    console.error(e);
    message('!', '활동지를 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', step + ' / ' + (e && (e.code || e.message) || '알 수 없음'));
  }
}
function pickGroup() {
  document.title = sh.title;
  app.innerHTML = `<div class="top"><div class="ev">${esc(sh.eventTitle || '')}</div><h1>${esc(sh.title)}</h1><p>우리 모둠을 골라 주세요.</p></div>
    <div class="card"><div class="gpick">${groups.map(g => `<button data-g="${g.id}">${esc(g.name)}</button>`).join('')}</div></div>`;
}
async function loadGroup() {
  const saved = await S.getSheetAnswer(eid, hid, gid);
  answers = saved ? { ...(saved.answers || {}) } : {};
  savedAt = saved ? atText(saved) : null;
  try { const d = JSON.parse(localStorage.getItem(DKEY())); if (d && d.answers && (!saved || d.t > (saved.at && saved.at.toMillis ? saved.at.toMillis() : saved.at || 0))) answers = { ...answers, ...d.answers }; } catch (e) {}
  render();
}
function render() {
  const g = sh.groups[gid];
  document.title = `${g.name} · ${sh.title}`;
  const qs = sh.questions.map((q, i) => `<section class="card"><span class="n">${i + 1}번</span><div class="t">${esc(q.text)}</div>
    ${q.type === 'choice' ? q.options.map(o => `<button type="button" class="choice ${answers[q.id] === o ? 'on' : ''}" data-q="${q.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('')
      : `<textarea data-q="${q.id}" maxlength="2000" placeholder="모둠원과 의논해서 적어 주세요">${esc(answers[q.id] || '')}</textarea>`}</section>`).join('');
  app.innerHTML = `<div class="top"><div class="ev">${esc(sh.eventTitle || '')}</div><h1>${esc(sh.title)}</h1><span class="grp">${esc(g.name)}</span>
      ${sh.intro ? `<p>${esc(sh.intro)}</p>` : ''}</div>
    ${sh.open ? '' : '<div class="card" style="text-align:center;color:var(--sub)">선생님이 활동지를 마감했어요. 낸 내용만 볼 수 있어요.</div>'}
    ${qs}
    ${sh.open ? '<button class="submit" id="submit">모둠 활동지 내기</button>' : ''}
    <div class="state ${savedAt ? 'ok' : ''}" id="state">${savedAt ? `${savedAt}에 냈어요. 고쳐서 다시 낼 수 있어요.` : '여러 번 고쳐 낼 수 있어요. 같은 모둠은 휴대폰 여러 대로 함께 써도 돼요.'}</div>
    <button class="link" id="other">우리 모둠이 아니에요</button>`;
  if (!sh.open) app.querySelectorAll('textarea,.choice').forEach(x => x.disabled = true);
}
function keepDraft() { try { localStorage.setItem(DKEY(), JSON.stringify({ t: Date.now(), answers })); } catch (e) {} }

app.addEventListener('click', async ev => {
  const gb = ev.target.closest('[data-g]');
  if (gb) { gid = gb.dataset.g; const u = new URL(location.href); u.searchParams.set('g', gid); history.replaceState(null, '', u); return loadGroup(); }
  const cb = ev.target.closest('.choice');
  if (cb && !cb.disabled) { answers[cb.dataset.q] = cb.dataset.v; keepDraft(); app.querySelectorAll(`.choice[data-q="${cb.dataset.q}"]`).forEach(x => x.classList.toggle('on', x === cb)); return; }
  if (ev.target.id === 'other') { gid = null; const u = new URL(location.href); u.searchParams.delete('g'); history.replaceState(null, '', u); return pickGroup(); }
  if (ev.target.id === 'submit') {
    const btn = ev.target, st = document.getElementById('state');
    const clean = {};
    sh.questions.forEach(q => { const v = answers[q.id]; if (v !== undefined && String(v).trim() !== '') clean[q.id] = String(v).trim().slice(0, 2000); });
    if (!Object.keys(clean).length) { st.className = 'state err'; st.textContent = '한 가지 이상 적어 주세요.'; return; }
    btn.disabled = true; btn.textContent = '보내는 중...';
    try {
      await S.saveSheetAnswer(eid, hid, gid, clean, uid);
      try { localStorage.removeItem(DKEY()); } catch (e) {}
      const d = new Date(); savedAt = `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      st.className = 'state ok'; st.textContent = `${savedAt}에 냈어요. 고쳐서 다시 낼 수 있어요.`;
      btn.textContent = '고친 내용 다시 내기';
    } catch (e) {
      console.error(e);
      st.className = 'state err'; st.textContent = '보내지 못했어요. 마감되었거나 인터넷이 끊겼을 수 있어요. 적은 내용은 이 휴대폰에 남아 있어요.';
      btn.textContent = '모둠 활동지 내기';
    }
    btn.disabled = false;
  }
});
app.addEventListener('input', ev => { if (ev.target.tagName === 'TEXTAREA') { answers[ev.target.dataset.q] = ev.target.value; keepDraft(); } });

boot();
</script>
</body>
</html>
