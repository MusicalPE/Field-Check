<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체험첵! Field-Check!</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--sub:#6b7487;--line:#e3e7ef;--pri:#2457d6;--pri-soft:#e9efff;--acc:#f5b301;--acc-soft:#fff6db;--ok:#1f9d6b;--ok-soft:#e3f6ee;--warn:#d93f45;--warn-soft:#fde8e9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.55}
  button{font:inherit;cursor:pointer}
  header{background:var(--pri);color:#fff;position:sticky;top:0;z-index:10}
  .hd{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:900;font-size:19px;letter-spacing:-.3px;cursor:pointer}
  .logo{display:flex;align-items:center;gap:8px}
  .logo img{width:30px;height:30px}
  .login-logo{width:220px;max-width:70%;display:block;margin:0 auto 14px;border-radius:24px}
  .logo small{font-weight:500;font-size:12px;opacity:.8;margin-left:4px}
  .mode{font-size:11px;background:var(--acc);color:#3d2c00;border-radius:999px;padding:2px 8px;font-weight:700}
  .sp{flex:1}
  .who{font-size:13px;opacity:.9}
  .hbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
  main{max-width:880px;margin:0 auto;padding:18px 16px 80px}
  h2{font-size:19px;margin:0}
  .rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500}
  .btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
  .btn.warn{color:var(--warn);border-color:#f4c5c7}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .evc{cursor:pointer;transition:.12s}
  .evc:hover{border-color:var(--pri);box-shadow:0 4px 14px rgba(36,87,214,.08)}
  .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--pri-soft);color:var(--pri)}
  .badge.acc{background:var(--acc-soft);color:#8a6100}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}
  .badge.gray{background:#eef0f4;color:var(--sub)}
  .evc h3{margin:8px 0 4px;font-size:17px}
  .meta{font-size:13px;color:var(--sub)}
  .bar{height:7px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .empty{text-align:center;padding:46px 20px;color:var(--sub)}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
  .evhead{margin-bottom:14px}
  .evhead h2{font-size:22px;margin:6px 0 4px}
  .count{font-weight:900;font-size:15px;color:var(--pri)}
  .tabs{display:flex;gap:6px;margin:16px 0 14px;background:#e9ecf3;padding:5px;border-radius:14px}
  .tab{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:700;color:var(--sub)}
  .tab.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .tab small{display:block;font-weight:500;font-size:11px}
  .sec{margin-bottom:22px}
  .sec>h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .task input{width:22px;height:22px;accent-color:var(--ok);flex:none;cursor:pointer}
  .task .tx{flex:1;min-width:0}
  .task .tt{font-weight:500}
  .task.done .tt{text-decoration:line-through;color:var(--sub)}
  .task .tm{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .ib{border:0;background:transparent;color:var(--sub);font-size:13px;padding:4px 6px;border-radius:6px}
  .ib:hover{background:#eef0f4;color:var(--ink)}
  .list{padding:4px 0}
  .soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .soon .card{border-style:dashed;background:transparent;padding:14px}
  .soon b{display:block;margin-bottom:2px}
  .soon span{font-size:13px;color:var(--sub)}
  .svc{display:flex;flex-direction:column;gap:10px}
  .svc .acts{display:flex;gap:6px;flex-wrap:wrap}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(20,26,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 12px;overflow:auto}
  .ov.show{display:flex}
  .md{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:20px;position:relative}
  .md.wide{max-width:720px}
  .md h3{margin:0 0 14px;font-size:18px}
  .x{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:22px;color:var(--sub)}
  label.f{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 4px}
  .in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
  .in:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .mact .sp{flex:1}
  .qed{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
  .qed .qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .qed .qh b{font-size:13px;color:var(--pri)}
  .qed select{width:auto}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}
  .note{font-size:13px;background:var(--acc-soft);color:#6b4b00;border-radius:10px;padding:9px 12px;margin-top:10px}
  /* QR */
  .qrbox{text-align:center}
  .qrbox .qt{font-weight:900;font-size:20px;margin-bottom:2px}
  .qrbox .qs{color:var(--sub);font-size:13px;margin-bottom:14px}
  #qr{display:inline-block;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
  #qr img,#qr canvas{display:block}
  .url{font-size:12px;color:var(--sub);word-break:break-all;margin-top:10px}
  .qrbox:fullscreen{background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .qrbox:fullscreen .qt{font-size:44px}
  .qrbox:fullscreen .qs{font-size:22px}
  .qrbox:fullscreen #qr img,.qrbox:fullscreen #qr canvas{width:min(70vh,80vw)!important;height:auto!important}
  /* 결과 */
  .rq{border-top:1px solid var(--line);padding:14px 0}
  .rq .rt{font-weight:700;margin-bottom:8px}
  .rrow{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
  .rrow .rb{height:14px;background:#eef0f4;border-radius:5px;overflow:hidden}
  .rrow .rb i{display:block;height:100%;background:var(--pri)}
  .rrow .rn{text-align:right;color:var(--sub)}
  .avg{font-size:26px;font-weight:900;color:#8a6100}
  .txl{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .txl div{background:#f6f7fa;border-radius:10px;padding:8px 11px;font-size:14px}
  .pg{font-size:12px;font-weight:700;color:var(--sub);padding:10px 12px 2px}
  .pl{text-align:left;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px}
  .pl-g b{font-size:14px}
  .pl-g ul{margin:4px 0 10px;padding:0;list-style:none;font-size:14px}
  .pl-g li{padding:2px 0}
  .qrbox:fullscreen .pl{display:none}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-top:12px}
  .num{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;text-align:center;font-weight:900;font-size:17px;line-height:1.2}
  .num small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
  .num.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .num.on small{color:var(--ok)}
  .num.tch{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
  .num.tch small{color:var(--pri)}
  .rollrow{cursor:pointer}
  .rollrow:hover{background:#f7f8fb}
  .rollrow.now{background:var(--ok-soft)}
  .rtime{font-weight:900;font-size:17px;min-width:56px;color:var(--pri)}
  .rrowf{display:grid;grid-template-columns:1.3fr 1fr 2fr auto;gap:6px;margin-bottom:6px;align-items:center}
  @media (max-width:560px){.rrowf{grid-template-columns:1fr 1fr;}.rrowf input[data-rf=label]{grid-column:1/2}}
  .legend{font-size:12px;color:var(--sub);margin-top:10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2333;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .login{max-width:420px;margin:60px auto;text-align:center}
  .login h1{font-size:26px;margin:0 0 6px}
  .login p{color:var(--sub);margin:0 0 22px}
  @media (max-width:560px){.two{grid-template-columns:1fr}.rrow{grid-template-columns:90px 1fr 54px}.who{display:none}}
  @media print{
    body.printing header,body.printing main,body.printing .toast{display:none!important}
    body.printing .ov{position:static;background:none;padding:0;display:block}
    body.printing .md{max-width:none;border:0}
    body.printing .noprint{display:none!important}
    body.printing .qrbox .qt{font-size:34px}
    body.printing #qr{border:0}
    body.printing #qr img,body.printing #qr canvas{width:420px!important;height:auto!important;margin:0 auto}
  }
</style>
</head>
<body>
<header><div class="hd">
  <div class="logo" data-act="home"><img src="icon-64.png" alt="">체험첵!<small>Field-Check!</small></div>
  <span class="mode" id="mode" hidden>체험 모드</span>
  <div class="sp"></div>
  <span class="who" id="who"></span>
  <button class="hbtn" id="logout" data-act="logout" hidden>로그아웃</button>
</div></header>
<main id="main"></main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const S = window.Store;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- 기본 자료 ----------
const KINDS = ['현장체험학습', '수학여행', '수련활동', '기타'];
const DEFAULT_TASKS = [
  [-60, '체험학습 계획 세우기 (장소·일정·예산)'],
  [-50, '학교운영위원회 심의·학부모 의견 수렴 (해당 시)'],
  [-45, '사전 답사 다녀오기'],
  [-40, '가정통신문·참가 동의서 안내'],
  [-30, '차량 계약과 안전점검 요청'],
  [-30, '보험·안전공제 가입 확인'],
  [-21, '학생 건강 특이사항 확인 (명단은 교사 기기에만)'],
  [-14, '학생 안전 교육'],
  [-14, '모둠 편성·사전 조사 안내'],
  [-7, '준비물 안내'],
  [-3, '인솔 계획·비상연락망 점검'],
  [-1, '최종 인원·날씨 확인'],
  [0, '출발 전 안전 교육·인원 점검'],
  [3, '사후 설문 받기'],
  [7, '결과 보고서·정산 정리'],
];
const DEFAULT_SURVEY = {
  title: '체험학습 돌아보기',
  questions: [
    { type: 'star', text: '이번 체험학습은 전체적으로 어땠나요?' },
    { type: 'choice', text: '가장 좋았던 점은 무엇인가요?', options: ['친구들과 함께한 시간', '새로 알게 된 것', '직접 해 본 활동', '먹거리·볼거리'] },
    { type: 'star', text: '모둠 활동에 얼마나 열심히 참여했나요?' },
    { type: 'choice', text: '다음에도 이곳에 오고 싶나요?', options: ['꼭 다시 오고 싶어요', '그저 그래요', '다른 곳이 더 좋아요'] },
    { type: 'text', text: '가장 기억에 남는 장면을 적어 주세요.' },
    { type: 'text', text: '선생님께 하고 싶은 말이 있다면 적어 주세요.' },
  ],
};
const QTYPES = { star: '별점 (5점)', choice: '고르기', text: '자유롭게 쓰기' };
// 준비물 기본 목록: [분류, 두고 오는 물건인지, [항목...]]
const PACK_STUDENT_DAY = [
  ['꼭 챙겨요', false, ['작은 가방(배낭)', '물병', '손수건·휴지', '필기도구·활동지', '우산 또는 우비', '개인 상비약 (필요한 학생)']],
  ['있으면 좋아요', false, ['모자', '간식 (약속한 만큼)', '물티슈', '비닐봉투']],
  ['가져오지 않아요', true, ['비싼 물건', '날카롭거나 위험한 물건', '너무 많은 용돈']],
];
const PACK_STUDENT_NIGHT = [
  ['숙박할 때 챙겨요', false, ['갈아입을 옷', '잠옷', '속옷·양말', '세면도구 (칫솔·치약·수건)', '휴대폰 충전기', '젖은 옷 담을 비닐봉투']],
];
const PACK_TEACHER = [
  ['서류', false, ['학생 명렬표·비상연락망', '인솔 계획서·일정표', '차량·숙소·체험장 연락처', '안전 교육 자료']],
  ['안전', false, ['구급약품 (밴드·소독약·해열제 등)', '학생 개인 상비약 보관 목록', '호루라기', '모둠 깃발·조끼']],
  ['기타', false, ['보조배터리', '우비·우산', '쓰레기봉투', '영수증 봉투']],
];
const packItems = (groups, withDone) => groups.flatMap(([cat, leave, items]) =>
  items.map(t => ({ id: S.newId(), cat, t, ...(leave ? { leave: true } : {}), ...(withDone ? { done: false } : {}) })));
function groupItems(items) {
  const order = [], map = {};
  (items || []).forEach(it => { if (!map[it.cat]) { map[it.cat] = []; order.push(it.cat); } map[it.cat].push(it); });
  return order.map(cat => ({ cat, leave: !!map[cat][0].leave, items: map[cat] }));
}

// ---------- 날짜 ----------
const WK = '일월화수목금토';
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dt, n) => { const d = new Date(dt); d.setDate(d.getDate() + n); return d; };
const diff = (a, b) => Math.round((a - b) / 86400000);
const fmt = d => `${d.getMonth() + 1}.${d.getDate()}(${WK[d.getDay()]})`;
const dLabel = n => n === 0 ? '당일' : (n < 0 ? 'D' + n : 'D+' + n);
function countdown(ev) {
  const left = diff(parseD(ev.date), today());
  const end = ev.endDate ? diff(parseD(ev.endDate), today()) : left;
  if (left > 0) return `출발 ${left}일 전`;
  if (left === 0) return '오늘 출발';
  if (end >= 0) return '체험학습 중';
  return '다녀왔어요';
}
function dateRange(ev) {
  const a = parseD(ev.date);
  if (!ev.endDate || ev.endDate === ev.date) return fmt(a);
  return `${fmt(a)} ~ ${fmt(parseD(ev.endDate))}`;
}

// ---------- 상태 ----------
let user = null, events = [], cur = null, tab = 'pre', surveys = [], rcount = {};
let plist = null, pcount = 0, ldraft = null;
let safeties = [], vmap = {};
let roll = null, marks = [], unwatch = null;
const PLACES = { home: '집에서 가족과', class: '교실에서', alone: '혼자서', teacher: '선생님 확인' };
const PLACE_SHORT = { home: '가정', class: '교실', alone: '혼자', teacher: '확인' };

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800); }
function openModal(html, wide) { $('#md').className = 'md' + (wide ? ' wide' : ''); $('#md').innerHTML = '<button class="x noprint" data-act="close">×</button>' + html; $('#ov').classList.add('show'); }
function closeModal() { $('#ov').classList.remove('show'); $('#md').innerHTML = ''; draft = null; ldraft = null; rdraft = null; }

// ---------- 시작 ----------
if (S.mode === 'demo') $('#mode').hidden = false;
S.onUser(async u => {
  user = u;
  if (!u) { $('#who').textContent = ''; $('#logout').hidden = true; return renderLogin(); }
  $('#who').textContent = u.displayName || u.email || '';
  $('#logout').hidden = S.mode === 'demo';
  await loadEvents();
  const id = location.hash.match(/^#e=(.+)$/);
  if (id && events.find(e => e.id === id[1])) openEvent(id[1]); else renderHome();
});

function renderLogin() {
  $('#main').innerHTML = `<div class="login card">
    <img src="logo.png" alt="체험첵! Field-Check!" class="login-logo">
    <p>현장체험학습·수학여행 준비부터 사후 설문까지 한곳에서 챙겨요.</p>
    <button class="btn pri" data-act="login">구글 계정으로 시작하기</button>
    <div class="hint" style="margin-top:14px">학생은 로그인 없이 QR로만 참여해요.</div></div>`;
}

async function loadEvents() {
  events = await S.listEvents(user.uid);
  events.sort((a, b) => a.date.localeCompare(b.date));
}

// ---------- 홈 ----------
function renderHome() {
  stopWatch(); roll = null; marks = [];
  cur = null; history.replaceState(null, '', location.pathname + location.search);
  const t = today();
  const up = events.filter(e => parseD(e.endDate || e.date) >= t);
  const past = events.filter(e => parseD(e.endDate || e.date) < t).reverse();
  const card = e => {
    const done = (e.tasks || []).filter(x => x.done).length, tot = (e.tasks || []).length;

async function saveEventForm() {
  const title = $('#f-title').value.trim(), date = $('#f-date').value;

async function openEvent(id, keepTab) {
  cur = events.find(e => e.id === id);
  if (!keepTab) tab = 'pre';
  history.replaceState(null, '', '#e=' + id);
  if (!keepTab) { plist = null; pcount = 0; }
  renderEvent();
  plist = await S.getList(id, 'student');
  roll = await S.getRoll(id);
  marks = roll ? await S.listMarks(id) : [];
  if (!keepTab) startWatch();
  safeties = await S.listSafety(id);
  safeties.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  vmap = {};
  await Promise.all(safeties.map(async s => { vmap[s.id] = await S.listViews(id, s.id); }));
  pcount = plist ? await S.countChecks(id, 'student') : 0;
  surveys = await S.listSurveys(id);
  surveys.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  rcount = {};
  await Promise.all(surveys.map(async s => { rcount[s.id] = (await S.listResponses(id, s.id)).length; }));
  if (cur && cur.id === id) renderEvent();
}

function taskStatus(task, due) {
  if (task.done) return '<span class="badge ok">완료</span>';
  const left = diff(due, today());
  if (left < 0) return '<span class="badge warn">기한 지남</span>';
  if (left === 0) return '<span class="badge warn">오늘까지</span>';
  if (left <= 7) return `<span class="badge acc">${left}일 남음</span>`;
  return '';
}

async function saveListForm() {
  const isS = ldraft.kind === 'student';
  const old = isS ? plist.items : cur.teacherItems;
  const items = [];
  for (const c of ldraft.cats) {
    const name = c.name.trim(), lines = [...new Set(c.text.split('\n').map(x => x.trim()).filter(Boolean))];
    if (!lines.length) continue;
    if (!name) return toast('분류 이름을 적어 주세요');
    lines.forEach(t => {
      const prev = old.find(o => o.cat === name && o.t === t);
      items.push({ id: prev ? prev.id : S.newId(), cat: name, t, ...(isS && c.leave ? { leave: true } : {}), ...(!isS ? { done: prev ? !!prev.done : false } : {}) });
    });
  }
  if (!items.length) return toast('물건을 하나 이상 적어 주세요');
  if (isS) {
    plist = { ...plist, items, updatedAt: Date.now() };
    await S.saveList(cur.id, 'student', plist);
  } else {
    cur.teacherItems = items; await saveCur();
  }
  closeModal(); renderEvent(); toast('저장했어요');
}

async function downloadCsv(sid) {

  const days = tripDays(), list = [];
  if (days.length === 1) {
    [['08:30', '출발 전 (버스 탑승)'], ['12:30', '점심 후'], ['15:00', '학교 도착']].forEach(([t, l]) => list.push([days[0], t, l]));
  } else days.forEach((d, i) => {
    const last = i === days.length - 1;
    const plan = i === 0 ? [['08:30', '출발 전 (버스 탑승)'], ['12:30', '점심 후'], ['17:00', '숙소 도착'], ['21:30', '숙소 점호']]
      : last ? [['08:00', '아침 모임'], ['12:30', '점심 후'], ['15:30', '학교 도착']]
      : [['08:00', '아침 모임'], ['12:30', '점심 후'], ['17:00', '숙소 도착'], ['21:30', '숙소 점호']];
    plan.forEach(([t, l]) => list.push([d, t, l]));
  });
  return list.map(([date, time, label]) => ({ id: S.newId(), date, time, label }));
}
function slotTimes(sl, before, after) {
  const [h, m] = sl.time.split(':').map(Number), d = parseD(sl.date);
  d.setHours(h, m, 0, 0);
  return { ...sl, openAt: d.getTime() - before * 60000, closeAt: d.getTime() + after * 60000 };
}
function buildRoll(slots, total, before, after) {
  const map = {};
  slots.forEach(sl => { map[sl.id] = slotTimes(sl, before, after); });
  return { owner: user.uid, eventTitle: cur.title, total, before, after, slots: map,
    createdAt: roll ? roll.createdAt : Date.now(), updatedAt: Date.now() };
}
const sortedSlots = () => roll ? Object.values(roll.slots).sort((a, b) => a.openAt - b.openAt) : [];
const slotStatus = sl => { const now = Date.now(); return now < sl.openAt ? 'soon' : now > sl.closeAt ? 'past' : 'open'; };
const slotMarks = id => marks.filter(m => m.slot === id);
const slotName = sl => `${fmt(parseD(sl.date))} ${sl.time} ${sl.label}`;

function startWatch() {
  stopWatch();
  if (!roll) return;
  const id = cur.id;
  unwatch = S.watchMarks(id, m => {
    if (!cur || cur.id !== id) return;
    marks = m;
    if ($('#rollboard')) rollBoard($('#rollboard').dataset.slot);
    if (tab === 'day') renderEvent();
  }, e => console.error(e));
}
function stopWatch() { if (unwatch) { unwatch(); unwatch = null; } }

function dayTab() {
  const soon = `<div class="sec"><h3>곧 들어올 기능</h3><div class="soon">
    <div class="card"><b>조별 활동지</b><span>모둠 QR로 현장 미션 해결·사진 올리기</span></div></div></div>`;
  if (!roll) return `<div class="sec"><h3>인원 점검</h3><div class="card svc">
      <div><div class="meta">버스 탑승, 점심 후, 숙소 점호처럼 정해진 시간마다 인원을 확인해요. 학생은 QR로 들어와 자기 번호를 누르고, 남은 번호는 선생님이 직접 확인해요.${cur.endDate ? ' 날짜마다 기본 점검 시간이 들어가요.' : ''}</div></div>
      <div class="acts"><button class="btn sm pri" data-act="roll-start">기본 점검 시간으로 시작하기</button></div></div></div>${soon}`;
  const days = {};
  sortedSlots().forEach(sl => { (days[sl.date] = days[sl.date] || []).push(sl); });
  const dayKeys = Object.keys(days).sort(), all = tripDays();
  const blocks = dayKeys.map(d => {
    const idx = all.indexOf(d);
    const rows = days[d].map(sl => {
      const st = slotStatus(sl), n = new Set(slotMarks(sl.id).map(m => Number(m.n))).size, left = roll.total - n;
      const badge = st === 'open' ? '<span class="badge ok">지금 점검 중</span>' : st === 'soon' ? '<span class="badge gray">예정</span>' : '<span class="badge gray">지남</span>';
      const cnt = st === 'soon' && !n ? '' : `<span class="badge ${left > 0 ? (st === 'soon' ? '' : 'warn') : 'ok'}">${n}/${roll.total}${left > 0 && st !== 'soon' ? ` · ${left}명 남음` : left <= 0 ? ' · 모두 확인' : ''}</span>`;
      return `<div class="task rollrow ${st === 'open' ? 'now' : ''}" data-act="roll-board" data-id="${sl.id}">
        <div class="rtime">${esc(sl.time)}</div>
        <div class="tx"><div class="tt">${esc(sl.label)}</div><div class="tm">${badge} ${cnt}</div></div>
        <span class="ib">번호표</span></div>`;
    }).join('');
    return `<div class="pg">${idx >= 0 ? idx + 1 + '일차 · ' : ''}${fmt(parseD(d))}</div>${rows}`;
  }).join('');
  return `<div class="sec">
    <div class="rowb"><h3 style="margin:0;font-size:16px">인원 점검</h3>
      <div class="acts" style="display:flex;gap:6px"><button class="btn sm pri" data-act="roll-qr">QR·인쇄</button><button class="btn sm" data-act="roll-edit">점검 시간 고치기</button></div></div>
    <div class="meta" style="margin-bottom:8px">학생 ${roll.total}명 · 점검 시간 ${roll.before}분 전부터 ${roll.after}분 뒤까지 학생이 체크할 수 있어요. 번호표는 실시간으로 채워져요.</div>
    <div class="card" style="padding:4px 4px 6px">${blocks || '<div class="empty">점검 시간이 없어요</div>'}</div>
  </div>${soon}`;
}

async function startRoll() {
  roll = buildRoll(defaultSlots(), guessTotal(), 10, 30);
  await S.saveRoll(cur.id, roll);
  marks = []; startWatch(); renderEvent(); toast('기본 점검 시간을 만들었어요');
}

function rollBoard(slotId) {
  const sl = roll.slots[slotId];
  if (!sl) return closeModal();
  const ms = {}; slotMarks(slotId).forEach(m => { ms[Number(m.n)] = m; });
  const n = Object.keys(ms).length, st = slotStatus(sl);
  const bySt = slotMarks(slotId).filter(m => m.src === 'student').length;
  let nums = '';
  for (let i = 1; i <= roll.total; i++) {
    const m = ms[i];
    nums += `<button class="num ${m ? (m.src === 'teacher' ? 'tch' : 'on') : ''}" data-act="roll-num" data-id="${slotId}" data-n="${i}">${i}<small>${m ? (m.src === 'teacher' ? '확인' : '본인') : '아직'}</small></button>`;
  }
  const missing = []; for (let i = 1; i <= roll.total; i++) if (!ms[i]) missing.push(i);
  const html = `<div id="rollboard" data-slot="${slotId}"><h3>${esc(slotName(sl))}</h3>
    <div><span class="badge ${st === 'open' ? 'ok' : 'gray'}">${st === 'open' ? '지금 점검 중' : st === 'soon' ? '예정' : '지남'}</span>
      <span class="badge ${missing.length ? 'warn' : 'ok'}">${n}/${roll.total}명 확인</span>
      <span class="badge gray">학생 체크 ${bySt} · 선생님 확인 ${n - bySt}</span></div>
    ${missing.length ? `<div class="meta" style="margin-top:8px">남은 번호: <b style="color:var(--warn)">${missing.join(', ')}</b></div>` : '<div class="meta" style="margin-top:8px;color:var(--ok);font-weight:700">모두 확인했어요</div>'}
    <div class="nums">${nums}</div>
    <div class="legend">'아직'인 번호를 누르면 선생님 확인으로 체크돼요. 체크된 번호를 누르면 취소할 수 있어요. 학생이 체크하면 바로 채워져요.</div></div>`;
  if ($('#rollboard')) { $('#md').innerHTML = '<button class="x noprint" data-act="close">×</button>' + html; }
  else openModal(html, true);
}
async function toggleRollNum(slotId, n) {
  const has = slotMarks(slotId).some(m => Number(m.n) === n);
  if (has) { if (!confirm(`${n}번 확인을 취소할까요?`)) return; await S.removeMark(cur.id, slotId, n); }
  else { try { await S.addMark(cur.id, slotId, n, 'teacher', user.uid); } catch (e) { if (!String(e.message).includes('already')) throw e; } }
  marks = await S.listMarks(cur.id); rollBoard(slotId); renderEvent();
}

let rdraft = null;
function rollForm() {
  rdraft = { total: roll.total, before: roll.before, after: roll.after, slots: sortedSlots().map(s => ({ id: s.id, date: s.date, time: s.time, label: s.label })) };
  renderRollForm();
}
function renderRollForm() {
  const days = tripDays();
  const rows = rdraft.slots.map((s, i) => {
    const opts = [...new Set([...days, s.date])].sort().map(d => `<option value="${d}" ${d === s.date ? 'selected' : ''}>${days.indexOf(d) >= 0 ? days.indexOf(d) + 1 + '일차 ' : ''}${fmt(parseD(d))}</option>`).join('');
    return `<div class="rrowf"><select class="in" data-ri="${i}" data-rf="date">${opts}</select>
      <input class="in" type="time" data-ri="${i}" data-rf="time" value="${s.time}">
      <input class="in" data-ri="${i}" data-rf="label" value="${esc(s.label)}" placeholder="예: 버스 탑승">
      <button class="ib" data-act="rs-del" data-i="${i}">빼기</button></div>`;
  }).join('');
  openModal(`<h3>점검 시간 고치기</h3>
    <div class="two">
      <div><label class="f">학생 수 (번호 1번부터)</label><input class="in" type="number" min="1" max="200" id="rl-total" value="${rdraft.total}"></div>
      <div><label class="f">학생이 체크할 수 있는 때</label><div style="display:flex;gap:6px;align-items:center">
        <input class="in" type="number" min="0" max="120" id="rl-before" value="${rdraft.before}" style="width:70px"><span class="meta">분 전부터</span>
        <input class="in" type="number" min="5" max="240" id="rl-after" value="${rdraft.after}" style="width:70px"><span class="meta">분 뒤까지</span></div></div>
    </div>
    <label class="f">점검 시간</label>${rows}
    <button class="btn sm" data-act="rs-add">+ 점검 시간 더하기</button>
    <div class="hint" style="margin-top:8px">이미 체크된 기록은 점검 시간을 고쳐도 그대로 남아요. 점검을 빼면 그 점검의 기록은 목록에서 보이지 않아요.</div>
    <div class="mact"><div class="sp"></div><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="rs-save">저장</button></div>`, true);
}
async function saveRollForm() {
  const total = Math.round(Number($('#rl-total').value)), before = Math.round(Number($('#rl-before').value)), after = Math.round(Number($('#rl-after').value));
  if (!(total >= 1 && total <= 200)) return toast('학생 수를 1~200 사이로 적어 주세요');
  if (!(before >= 0 && before <= 120) || !(after >= 5 && after <= 240)) return toast('체크할 수 있는 때를 다시 확인해 주세요');
  if (!rdraft.slots.length) return toast('점검 시간을 하나 이상 넣어 주세요');
  for (const [i, s] of rdraft.slots.entries()) {
    s.label = s.label.trim();
    if (!s.time) return toast(`${i + 1}번째 점검 시간을 적어 주세요`);
    if (!s.label) return toast(`${i + 1}번째 점검 이름을 적어 주세요`);
  }
  roll = buildRoll(rdraft.slots, total, before, after);
  await S.saveRoll(cur.id, roll);
  rdraft = null; closeModal(); renderEvent(); toast('저장했어요');
}
function rollQR() {
  const u = new URL('rollcall.html', location.href);
  u.hash = ''; u.search = `?e=${encodeURIComponent(cur.id)}`;
  const days = {}, all = tripDays();
  sortedSlots().forEach(sl => { (days[sl.date] = days[sl.date] || []).push(sl); });
  const list = Object.keys(days).sort().map(d => `<div class="pl-g"><b>${all.indexOf(d) >= 0 ? all.indexOf(d) + 1 + '일차 ' : ''}${fmt(parseD(d))}</b><ul>${days[d].map(s => `<li>${esc(s.time)} ${esc(s.label)}</li>`).join('')}</ul></div>`).join('');
  qrModal({ url: u.toString(), title: `${cur.title} 인원 점검`,
    sub: `점검 시간이 되면 이 QR로 들어와 내 번호를 눌러요 · ${roll.before}분 전부터 ${roll.after}분 뒤까지`,
    extra: `<div class="pl">${list}</div>` });
}

setInterval(() => { if (cur && tab === 'day' && !$('#ov').classList.contains('show')) renderEvent(); }, 30000);

// ---------- 이벤트 연결 ----------
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) { if (ev.target.id === 'ov') closeModal(); return; }
  const act = el.dataset.act, id = el.dataset.id;
  try {
    switch (act) {
      case 'login': await S.signInGoogle(); break;
      case 'logout': if (confirm('로그아웃할까요?')) await S.signOut(); break;
      case 'home': if (user) { await loadEvents(); renderHome(); } break;
      case 'close': closeModal(); break;
      case 'new-event': cur = null; eventForm(); break;
      case 'open': openEvent(id); break;
      case 'edit-event': eventForm(cur); break;
      case 'save-event': await saveEventForm(); break;
      case 'del-event':
        if (!confirm(`'${cur.title}'을(를) 지울까요? 업무 일정과 설문·응답이 모두 사라져요.`)) return;
        await S.deleteEvent(cur.id); closeModal(); await loadEvents(); renderHome(); toast('지웠어요'); break;
      case 'tab': tab = el.dataset.tab; renderEvent(); break;
      case 'toggle': {
        const t = cur.tasks.find(x => x.id === id); t.done = el.checked; renderEvent(); await saveCur(); break;
      }
      case 'add-task': taskForm(); break;
      case 'edit-task': taskForm(cur.tasks.find(x => x.id === id)); break;
      case 'save-task': {
        const text = $('#t-t').value.trim(); if (!text) return toast('할 일을 적어 주세요');
        const d = taskOffset();
        if (id) Object.assign(cur.tasks.find(x => x.id === id), { t: text, d });
        else cur.tasks.push({ id: S.newId(), t: text, d, done: false });
        closeModal(); renderEvent(); await saveCur(); break;
      }
      case 'del-task':
        if (!confirm('이 업무를 지울까요?')) return;
        cur.tasks = cur.tasks.filter(x => x.id !== id); closeModal(); renderEvent(); await saveCur(); break;
      case 'new-survey': surveyForm(); break;
      case 'edit-survey': surveyForm(surveys.find(x => x.id === id)); break;
      case 'q-add': draft.questions.push({ id: S.newId(), type: 'star', text: '' }); renderSurveyForm(); break;
      case 'q-del': draft.questions.splice(Number(el.dataset.i), 1); renderSurveyForm(); break;
      case 'q-up': case 'q-down': {
        const i = Number(el.dataset.i), j = act === 'q-up' ? i - 1 : i + 1;
        [draft.questions[i], draft.questions[j]] = [draft.questions[j], draft.questions[i]]; renderSurveyForm(); break;
      }
      case 'save-survey': await saveSurveyForm(); break;
      case 'toggle-open': {
        const s = surveys.find(x => x.id === id); s.open = !s.open; s.updatedAt = Date.now();
        await S.saveSurvey(cur.id, s); renderEvent(); toast(s.open ? '다시 받기 시작했어요' : '마감했어요'); break;
      }
      case 'del-survey': {
        const s = surveys.find(x => x.id === id);
        if (!confirm(`'${s.title}' 설문과 응답 ${rcount[id] || 0}개를 지울까요?`)) return;
        await S.deleteSurvey(cur.id, id); await openEvent(cur.id, true); toast('지웠어요'); break;
      }
      case 'qr': showQR(id); break;
      case 'pack-start-s': await startStudentList(); break;
      case 'sf-new': safetyForm(); break;
      case 'roll-start': await startRoll(); break;
      case 'roll-board': rollBoard(id); break;
      case 'roll-num': await toggleRollNum(id, Number(el.dataset.n)); break;
      case 'roll-edit': rollForm(); break;
      case 'roll-qr': rollQR(); break;
      case 'rs-add': { const d = tripDays(); rdraft.slots.push({ id: S.newId(), date: d[d.length - 1], time: '12:00', label: '' }); renderRollForm(); break; }
      case 'rs-del': rdraft.slots.splice(Number(el.dataset.i), 1); renderRollForm(); break;
      case 'rs-save': await saveRollForm(); break;
      case 'sf-edit': safetyForm(safeties.find(x => x.id === id)); break;
      case 'sf-save': await saveSafetyForm(id); break;
      case 'sf-qr': safetyQR(id); break;
      case 'sf-board': safetyBoard(id); break;
      case 'sf-board-refresh': vmap[id] = await S.listViews(cur.id, id); safetyBoard(id); renderEvent(); break;
      case 'sf-num': await toggleNum(id, Number(el.dataset.n)); break;
      case 'sf-copy': await copySafetyRecord(id); break;
      case 'sf-open': { const x = safeties.find(y => y.id === id); x.open = !x.open; x.updatedAt = Date.now(); await S.saveSafety(cur.id, x); renderEvent(); toast(x.open ? '다시 받기 시작했어요' : '마감했어요'); break; }
      case 'sf-del': {
        const x = safeties.find(y => y.id === id);
        if (!confirm(`'${x.title}'과(와) 시청 체크 ${(vmap[id] || []).length}개를 지울까요?`)) return;
        await S.deleteSafety(cur.id, id); await openEvent(cur.id, true); toast('지웠어요'); break;
      }
      case 'pack-start-t': cur.teacherItems = packItems(PACK_TEACHER, true); renderEvent(); await saveCur(); toast('교사 준비물 목록을 만들었어요'); break;
      case 'pack-edit': listForm(el.dataset.kind); break;
      case 'pack-save': await saveListForm(); break;
      case 'pack-qr': packQR(); break;
      case 'pack-refresh': pcount = await S.countChecks(cur.id, 'student'); renderEvent(); toast(`다 챙겼다고 알린 학생 ${pcount}명`); break;
      case 'tcheck': { const it = cur.teacherItems.find(x => x.id === id); it.done = el.checked; renderEvent(); await saveCur(); break; }
      case 'lc-add': ldraft.cats.push({ name: '', leave: false, text: '' }); renderListForm(); break;
      case 'lc-del': ldraft.cats.splice(Number(el.dataset.i), 1); renderListForm(); break;
      case 'copy': await navigator.clipboard.writeText(el.dataset.url); toast('주소를 복사했어요'); break;
      case 'print': document.body.classList.add('printing'); window.print(); document.body.classList.remove('printing'); break;
      case 'full': { const b = $('#qrbox'); if (b.requestFullscreen) b.requestFullscreen(); break; }
      case 'results': await showResults(id); break;
      case 'csv': await downloadCsv(id); break;
    }
  } catch (e) {
    console.error(e); toast('문제가 생겼어요. 잠시 뒤 다시 해 주세요');
  }
});

document.addEventListener('input', ev => {
  const t = ev.target;
  if (rdraft) {
    if (t.dataset.ri !== undefined) rdraft.slots[Number(t.dataset.ri)][t.dataset.rf] = t.value;
    if (t.id === 'rl-total') rdraft.total = t.value; if (t.id === 'rl-before') rdraft.before = t.value; if (t.id === 'rl-after') rdraft.after = t.value;
    return;
  }
  if (ldraft && t.dataset.lc !== undefined) {
    const c = ldraft.cats[Number(t.dataset.lc)];
    if (t.dataset.lf === 'leave') c.leave = t.checked; else c[t.dataset.lf] = t.value;
    return;
  }
  if (!draft) {
    if (t.id === 't-n' || t.id === 't-side') $('#t-due').textContent = fmt(addDays(parseD(cur.date), taskOffset())) + '까지';
    return;
  }
  if (t.dataset.f === 'title') draft.title = t.value;
  if (t.dataset.qi !== undefined) {
    const q = draft.questions[Number(t.dataset.qi)], f = t.dataset.qf;
    if (f === 'text') q.text = t.value;
    if (f === 'options') q.options = t.value.split('\n');
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 't-side') { $('#t-due').textContent = fmt(addDays(parseD(cur.date), taskOffset())) + '까지'; return; }
  if (draft && t.dataset.qf === 'type') {
    const q = draft.questions[Number(t.dataset.qi)];
    q.type = t.value;
    if (q.type === 'choice' && !q.options) q.options = ['', ''];
    renderSurveyForm();
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#ov').classList.contains('show')) closeModal(); });
</script>
