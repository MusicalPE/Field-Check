<style>
/* 체험첵! 그림 톤: 숲 나뭇잎 초록, 맑은 하늘, 가죽 가방 갈색, 금빛 체크 (캠첵!·트립첵!과 같은 틀) */
:root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF;
  --acc:#D9A23A; --acc-soft:#FBF1DC; --acc-ink:#7A5310;
  --brown:#A8693A; --brown-soft:#F6EADF;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3;
  --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 420px) no-repeat,var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* 머리 */
.rowb.hero{align-items:stretch}
.hero>img,.hero>div:not(.hside){align-self:center}
.hside{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px}
.hwho{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hd{max-width:1240px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.logo img{width:30px;height:30px;border-radius:9px;box-shadow:0 3px 8px var(--shadow)}
.logo b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1;color:var(--pri);white-space:nowrap}
.logo small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--brown);font-weight:500;text-transform:uppercase;white-space:nowrap}
.mode{font-size:11px;background:var(--acc-soft);color:var(--acc-ink);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:999px;padding:2px 9px;font-weight:800}
.sp{flex:1}
.who{font-size:13px;color:var(--sub);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.hbtn{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--sub)}
.hbtn:hover{border-color:var(--pri);color:var(--pri)}

main{max-width:1240px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 40px;min-height:70vh}
h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;color:var(--pri);line-height:1.2}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* 버튼·배지 */
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;transition:all .15s;min-height:40px}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri);box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 25%,transparent)}
.btn.pri:hover{filter:brightness(1.06);color:var(--on-pri)}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.btn.warn:hover{background:var(--warn-soft)}
.btn.sm{padding:6px 13px;font-size:13px;min-height:34px}
.btn:disabled{opacity:.45;cursor:default}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.badge.acc{background:var(--acc-soft);color:var(--acc-ink)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.gray{background:var(--soft);color:var(--sub);border:1px solid var(--line)}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:800;color:var(--sub);transition:all .15s}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}

/* 카드 */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 4px 16px var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.evc{cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:2px}
.evc:hover{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));transform:translateY(-2px);box-shadow:0 10px 26px var(--shadow)}
.evc h3{font-family:var(--f-display);font-weight:400;margin:8px 0 2px;font-size:23px;color:var(--ink);line-height:1.25}
.meta{font-size:13px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.empty{text-align:center;padding:44px 20px;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:22px;margin-bottom:6px}

/* 홈 머리 */
.hero{display:flex;align-items:center;gap:18px;margin-bottom:20px}
.hero img{width:clamp(110px,13vw,150px);border-radius:26px;box-shadow:0 8px 22px var(--shadow)}
.hero .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--brown);font-weight:500;text-transform:uppercase}
.hero h2{font-size:clamp(28px,4.4vw,40px)}
.hero p{margin:2px 0 0;color:var(--sub);font-size:14px}

/* 체험학습 머리 */
.evhead{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:center;margin-bottom:16px;padding:22px 24px}
.evhead h2{font-size:clamp(28px,4vw,40px);margin:4px 0 4px}
.evhead .eyebrow{display:flex;gap:6px;flex-wrap:wrap}
.meter{text-align:center;background:var(--soft);border:1.5px solid var(--line);border-radius:18px;padding:12px 22px;min-width:132px}
.meter .mnum{font-family:var(--f-mono);font-size:32px;font-weight:500;color:var(--pri);line-height:1.1}
.meter .cap{font-size:12px;font-weight:800;color:var(--sub);margin-top:2px}
.evhead .full{grid-column:1/-1}
.evhead{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto}
.evhead .full{grid-column:1;grid-row:2}
.evhead .full .mbar{border-top:0;padding-top:0}
.evr{grid-column:2;grid-row:1/3;display:flex;gap:22px;align-items:center;align-self:stretch;border-left:1.5px solid var(--line);padding-left:24px}
.evwx{min-width:0}
.evwx.pc{max-width:min(440px,38vw);align-self:center}
.evwx.m{display:none}
.evwx-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px 6px;font-size:13px;color:var(--sub)}
.evwx-h b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--pri)}
.evwx-h a{margin-left:auto;font-weight:800;color:var(--pri);text-decoration:none;font-size:12.5px}
.evwx .wxempty{background:var(--soft);border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
.evwx .wx-table td{padding:6px 3px}
@media (max-width:1000px){.evwx.pc{display:none}.evwx.m{display:block;margin:-4px 0 16px;padding:14px 12px}}
.count{font-weight:800;font-size:14px;color:var(--pri)}
.mbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-top:12px;border-top:1.5px dashed var(--line)}
.cfbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
.mbar .chip,.cfbar .chip{padding:3px 12px}

/* 탭 */
.tabs{display:flex;gap:6px;margin:0 0 18px;background:var(--card);border:1.5px solid var(--line);padding:6px;border-radius:999px;box-shadow:0 4px 16px var(--shadow);position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:10}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 8px;font-weight:800;color:var(--sub);font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.tab small{font-weight:700;font-size:12px;opacity:.75}
.tab.on{background:var(--pri);color:var(--on-pri);box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}

/* 2단 배치 */
.cols{display:grid;grid-template-columns:1fr;gap:4px 22px;align-items:start}
@media (min-width:1000px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.sec{margin-bottom:22px;min-width:0}
@media (max-width:640px){
  .sec>h3,.sec>.rowb>h3{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .sec>.rowb>h3{display:flex;align-items:center;gap:8px}
  .sec>h3::after,.sec>.rowb>h3::after{content:"";flex:none;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-3px) rotate(45deg);margin-left:6px;opacity:.45;transition:transform .2s}
  .sec.fold>h3::after,.sec.fold>.rowb>h3::after{transform:rotate(-45deg)}
  .sec.fold>:not(:first-child){display:none!important}
  .sec.fold{margin-bottom:10px}
  .sec.fold>h3,.sec.fold>.rowb{margin-bottom:0}
}
.sec>h3,.sec h3.st{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--pri)}
.sec .rowb h3{font-family:var(--f-display);font-weight:400;font-size:24px!important;color:var(--pri)}

/* 목록 줄 */
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid transparent;transition:background .15s}
.task+.task{border-top-color:transparent}
.task:hover{background:var(--soft);border-color:var(--line)}
.task input[type=checkbox]{appearance:none;width:24px;height:24px;flex:none;border:2px solid var(--sub);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:var(--card);margin:0;transition:all .15s}
.task input[type=checkbox]::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--on-pri);border-bottom:2.5px solid var(--on-pri);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.task input[type=checkbox]:checked{background:var(--pri);border-color:var(--pri)}
.task input[type=checkbox]:checked::after{opacity:1}
.task .tx{flex:1;min-width:0}
.task .tt{font-weight:700;word-break:keep-all;overflow-wrap:break-word}
.paren{display:inline-block;font-weight:400;color:var(--sub);font-size:.92em}
.task:hover .pen{opacity:.85}
.task.done .tt{text-decoration:line-through;color:var(--sub);font-weight:400}
.task .tm{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ib{border:0;background:transparent;color:var(--sub);font-size:13px;font-weight:700;padding:6px 8px;border-radius:8px;white-space:nowrap}
.ib:hover{background:var(--soft);color:var(--brown)}
.ib:disabled{opacity:.35}
.list{padding:2px 0}
.pg{font-size:12px;font-weight:800;color:var(--brown);padding:12px 12px 2px;letter-spacing:.02em}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.soon .card{border-style:dashed;background:transparent;padding:14px;box-shadow:none}
.soon b{display:block;margin-bottom:2px}
.soon span{font-size:13px;color:var(--sub)}
.svc{display:flex;flex-direction:column;gap:12px}
.svc h3{font-family:var(--f-display);font-weight:400;font-size:21px!important;color:var(--ink)}
.svc .acts{display:flex;gap:6px;flex-wrap:wrap}
.rollrow{cursor:pointer}
.rollrow.now{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.rtime{font-family:var(--f-mono);font-weight:500;font-size:18px;min-width:58px;color:var(--pri)}
.nowcard{border-color:color-mix(in srgb,var(--ok) 40%,var(--line));background:linear-gradient(180deg,var(--ok-soft),var(--card) 70%)}
.nowcard .big{font-family:var(--f-mono);font-size:40px;color:var(--ok);line-height:1}

/* 창 (휴대폰에서는 아래에서 올라옴) */
.ov{position:fixed;inset:0;background:rgba(18,26,18,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:48px 16px;overflow:auto}
.ov.show{display:flex}
.md{background:var(--card);border:1px solid var(--line);border-radius:24px;width:100%;max-width:600px;padding:24px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.md.wide{max-width:820px}
.md h3{font-family:var(--f-display);font-weight:400;margin:0 34px 14px 0;font-size:26px;color:var(--pri);line-height:1.2}
.x{position:absolute;right:14px;top:12px;border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--sub);line-height:1}
@media (max-width:640px){
  .ov{align-items:flex-end;padding:0}
  .md,.md.wide{max-width:none;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
}
label.f{display:block;font-size:13px;font-weight:800;color:var(--sub);margin:12px 0 5px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;background:var(--soft);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 15%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.mact .sp{flex:1}
.qed{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;background:var(--soft)}
.qed .qh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qed .qh b{font-size:13px;color:var(--pri)}
.qed select{width:auto}
.hint{font-size:12.5px;color:var(--sub);margin-top:5px}
.note{font-size:13px;background:var(--acc-soft);color:var(--acc-ink);border-radius:12px;padding:10px 14px;margin-top:12px;border:1px solid color-mix(in srgb,var(--acc) 30%,transparent)}
.crow{display:grid;grid-template-columns:1fr 120px auto;gap:6px;align-items:center;margin-bottom:6px}
.rrowf{display:grid;grid-template-columns:1.3fr 1fr 2fr auto;gap:6px;margin-bottom:6px;align-items:center}
@media (max-width:640px){.rrowf{grid-template-columns:1fr 1fr}.rrowf input[data-rf=label]{grid-column:1/2}}

/* QR */
.qrbox{text-align:center}
.qrbox .qt{font-family:var(--f-display);font-size:28px;color:var(--pri);margin-bottom:2px}
.qrbox .qs{color:var(--sub);font-size:13px;margin-bottom:14px}
#qr{display:inline-block;padding:14px;background:#fff;border-radius:18px;box-shadow:inset 0 0 0 1px #E1E8DC}
#qr img,#qr canvas{display:block}
.url{font-size:12px;color:var(--sub);word-break:break-all;margin-top:10px;font-family:var(--f-mono)}
.qrbox:fullscreen{background:#fff;color:#232C22;display:flex;flex-direction:column;align-items:center;justify-content:center}
.qrbox:fullscreen .qt{font-size:52px}
.qrbox:fullscreen .qs{font-size:22px}
.qrbox:fullscreen #qr img,.qrbox:fullscreen #qr canvas{width:min(70vh,80vw)!important;height:auto!important}
.qrbox:fullscreen .pl{display:none}
.pl{text-align:left;margin-top:16px;border-top:1.5px dashed var(--line);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px}
.pl-g b{font-size:14px;color:var(--brown)}
.pl-g ul{margin:4px 0 10px;padding:0;list-style:none;font-size:14px}
.pl-g li{padding:2px 0}

/* 결과 */
.rq{border-top:1.5px dashed var(--line);padding:14px 0}
.rq .rt{font-weight:800;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:140px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.rrow .rb{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.rrow .rb i{display:block;height:100%;background:var(--pri);border-radius:7px}
.rrow .rn{text-align:right;color:var(--sub);font-family:var(--f-mono)}
.avg{font-family:var(--f-mono);font-size:28px;color:var(--acc-ink)}
.txl{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px}

// ---------- 날짜 ----------
const WK = '일월화수목금토';
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (dt, n) => { const d = new Date(dt); d.setDate(d.getDate() + n); return d; };
const diff = (a, b) => Math.round((a - b) / 86400000);
const fmt = d => `${d.getMonth() + 1}.${d.getDate()}(${WK[d.getDay()]})`;
const dLabel = n => n === 0 ? '당일' : (n < 0 ? 'D' + n : 'D+' + n);
function countdown(ev) {
  const left = diff(parseD(ev.date), today());
  const end = ev.endDate ? diff(parseD(ev.endDate), today()) : left;
  if (left > 0) return `출발 ${left}일 전`;
  if (left === 0) return '오늘 출발';
  if (end >= 0) return '체험학습 중';
  return '다녀왔어요';
}
function meter(ev) {
  const left = diff(parseD(ev.date), today());
  const end = ev.endDate ? diff(parseD(ev.endDate), today()) : left;
  if (left > 0) return `<div class="mnum">D-${left}</div><div class="cap">출발까지</div>`;
  if (left === 0) return `<div class="mnum">D-DAY</div><div class="cap">오늘 출발</div>`;
  if (end >= 0) return `<div class="mnum">${1 - left}일차</div><div class="cap">체험학습 중</div>`;
  return `<div class="mnum">완료</div><div class="cap">다녀왔어요</div>`;
}
function dateRange(ev) {
  const a = parseD(ev.date);
  if (!ev.endDate || ev.endDate === ev.date) return fmt(a);
  return `${fmt(a)} ~ ${fmt(parseD(ev.endDate))}`;
}

  return '';
}

async function packSubmit(form) {

  if (pf === 'add') {
    const t = form.t.value.trim(); if (!t) return;
    const z = zones.find(z => z.name === form.dataset.cat); if (!z) return;
    if (z.items.some(i => i.t === t)) { toast('이미 있는 항목이에요'); return; }
    z.items.push({ id: S.newId(), t, done: false });
    await savePack(k, zones); rerenderPack(z.name);
  } else if (pf === 'item') {
    const t = form.t.value.trim(); if (!t) return toast('항목 이름을 적어 주세요');
    zones.forEach(z => z.items.forEach(i => { if (i.id === form.dataset.id) { i.t = t; i.imp = !!(form.imp && form.imp.checked); } }));
    pq = null; await savePack(k, zones); rerenderPack();
  } else if (pf === 'zone') {
    const name = form.name.value.trim(), old = form.dataset.cat;
    if (!name) return toast('구역 이름을 적어 주세요');
    if (name !== old && zones.some(z => z.name === name)) return toast('같은 이름의 구역이 있어요');

    z.name = name; if (form.leave) z.leave = form.leave.checked;
    pq = null; zdel = null; await savePack(k, zones); rerenderPack();
  }
}

const visClasses = () => classesOf(cur).filter(c => clsFilter === 'all' || c.id === clsFilter);
const visTotal = () => visClasses().reduce((a, c) => a + Number(c.total), 0);

function numGrid(act, id, marked) {

    let nums = '';
    for (let i = 1; i <= c.total; i++) {
      const m = marked(c.id, i);
      nums += `<button class="num ${m ? m.cls : ''}" data-act="${act}" data-id="${id}" data-c="${c.id}" data-n="${i}">${i}<small>${m ? m.label : '아직'}</small></button>`;

      const a = d.address, name = a.region_3depth_name || a.region_2depth_name || a.region_1depth_name;
      add({ name, addr: d.address_name, url: '', lat: +d.y, lon: +d.x, cat: '지역', region: true });
    });

  if (!out.length) WX.PLACES.filter(p => p.name.startsWith(q) || q.startsWith(p.name)).forEach(p => add({ name: p.name, addr: p.name + ' 일대', url: '', lat: p.lat, lon: p.lon, cat: '지역', region: true }));

      case 'sf-edit': safetyForm(safeties.find(x => x.id === id)); break;
      case 'sf-save': await saveSafetyForm(id); break;
      case 'sf-qr': safetyQR(id); break;
      case 'sf-board': safetyBoard(id); break;
      case 'sf-board-refresh': vmap[id] = await S.listViews(cur.id, id); safetyBoard(id); renderEvent(); break;
      case 'sf-num': await toggleNum(id, el.dataset.c, Number(el.dataset.n)); break;
      case 'cls-filter': {
        clsFilter = id; try { localStorage.setItem(fKey(), id); } catch (e) {}
        if ($('#rollboard')) rollBoard($('#rollboard').dataset.slot);
        else if ($('#sfboard')) safetyBoard($('#sfboard').dataset.id);
        renderEvent(); break;
      }
      case 'team': await teamModal(); break;
      case 'team-newcode': if (!confirm('새 링크를 만들면 예전 링크로는 들어올 수 없어요. 이미 함께하는 선생님은 그대로예요. 만들까요?')) return;
        cur.inviteCode = newCode(); await saveCur('inviteCode'); await teamModal(); toast('새 초대 링크를 만들었어요'); break;
      case 'team-remove': {
        const nm = (cur.memberNames || {})[id] || '이 선생님';
        if (!confirm(`${nm}을(를) 이 체험학습에서 내보낼까요?`)) return;
        await S.removeMember(cur.id, id);
        cur.members = (cur.members || []).filter(x => x !== id); if (cur.memberNames) delete cur.memberNames[id];
        await teamModal(); renderEvent(); toast('내보냈어요'); break;
      }
      case 'team-leave':
        if (!confirm('이 체험학습에서 나갈까요? 다시 들어오려면 초대 링크가 필요해요.')) return;
        await S.removeMember(cur.id, user.uid); closeModal(); await loadEvents(); renderHome(); toast('나왔어요'); break;
      case 'cf-add': cdraft.push({ id: 'c' + S.newId(), name: (cdraft.length + 1) + '반', total: cdraft.length ? cdraft[cdraft.length - 1].total : 25 }); renderClassRows(); break;
      case 'cf-del': if (cdraft.length <= 1) return toast('반은 하나 이상 있어야 해요'); cdraft.splice(Number(el.dataset.i), 1); renderClassRows(); break;
      case 'sf-copy': await copySafetyRecord(id); break;
      case 'sf-open': { const x = safeties.find(y => y.id === id); x.open = !x.open; x.updatedAt = Date.now(); await S.saveSafety(cur.id, x); await touch(); renderEvent(); toast(x.open ? '다시 받기 시작했어요' : '마감했어요'); break; }
      case 'sf-del': {
        const x = safeties.find(y => y.id === id);
        if (!confirm(`'${x.title}'과(와) 시청 체크 ${(vmap[id] || []).length}개를 지울까요?`)) return;
        await S.deleteSafety(cur.id, id); await touch(); await openEvent(cur.id, true); toast('지웠어요'); break;
      }
      case 'pack-start-t': { const g = teacherDefaults(); cur.teacherItems = packItems(g, true); cur.teacherCats = g.map(([c]) => ({ name: c })); renderEvent(); await saveCur('teacherItems', 'teacherCats'); toast('교사 준비물 목록을 만들었어요'); break; }
      case 'pack-kind': packKind = id; pq = null; pdel = null; zdel = null; try { localStorage.setItem('fieldcheck-packkind', id); } catch (e) {} rerenderPack(); break;
      case 'item-edit': pq = { type: 'item', id }; pdel = null; rerenderPack(); break;
      case 'zone-edit': pq = { type: 'zone', cat: el.dataset.cat }; zdel = null; pdel = null; rerenderPack(); break;
      case 'pq-cancel': pq = null; zdel = null; rerenderPack(); break;
      case 'item-del': pdel = id; pq = null; rerenderPack(); break;
      case 'item-del-no': pdel = null; rerenderPack(); break;
      case 'item-del-yes': { const zs = zonesOf(packKind); zs.forEach(z => { z.items = z.items.filter(i => i.id !== id); }); pdel = null; await savePack(packKind, zs); rerenderPack(); break; }
      case 'zone-del': zdel = el.dataset.cat; rerenderPack(); break;
      case 'zone-del-no': zdel = null; rerenderPack(); break;
      case 'zone-del-yes': { const zs = zonesOf(packKind).filter(z => z.name !== el.dataset.cat); pq = null; zdel = null; await savePack(packKind, zs); rerenderPack(); break; }
      case 'pack-add-defaults': {
        const zs = zonesOf('teacher'), names = zs.map(z => z.name);
        const add = teacherDefaults().filter(([c]) => !names.includes(c));
        add.forEach(([c, , items]) => zs.push({ name: c, items: items.map(t0 => ({ id: S.newId(), t: t0.replace(/^!/, ''), imp: t0.startsWith('!'), done: false })) }));
        await savePack('teacher', zs); rerenderPack(); toast(`${add.map(([c]) => c).join(', ')} 구역을 더했어요`); break;
      }
      case 'zone-new': {
        const zs = zonesOf(packKind); let n = 1, name = '새 구역';
        while (zs.some(z => z.name === name)) name = '새 구역 ' + (++n);
        zs.push({ name, leave: false, items: [] }); await savePack(packKind, zs);
        pq = { type: 'zone', cat: name }; rerenderPack(); break;
      }
      case 'pack-qr': packQR(); break;
      case 'pack-refresh': pcount = await S.countChecks(cur.id, 'student'); rerenderPack(); toast(`다 챙겼다고 알린 학생 ${pcount}명`); break;
      case 'tcheck': { const it = cur.teacherItems.find(x => x.id === id); it.done = el.checked; rerenderPack(); await saveCur('teacherItems'); break; }
      case 'copy': await navigator.clipboard.writeText(el.dataset.url); toast('주소를 복사했어요'); break;
      case 'print': document.body.classList.add('printing'); window.print(); document.body.classList.remove('printing'); break;
      case 'full': { const b = $('#qrbox'); if (b.requestFullscreen) b.requestFullscreen(); break; }
      case 'results': await showResults(id); break;
      case 'csv': await downloadCsv(id); break;
    }
  } catch (e) {
    console.error(e); toast('문제가 생겼어요. 잠시 뒤 다시 해 주세요');
  }
});

document.addEventListener('submit', async ev => {
  const f = ev.target.closest('form[data-pf]');
  if (!f) return;
  ev.preventDefault();
  try {
    if (f.dataset.pf === 'plan-add' || f.dataset.pf === 'plan-edit') {
      const title = f.title.value.trim(); if (!title) { f.title.focus(); return; }
      const item = { time: normTime(f.time.value), title, memo: f.memo.value.trim() };
      if (f.dataset.pf === 'plan-add') await savePub({ plans: [...plansOf(), { id: S.newId(), day: planDay, ...item }] });
      else { await savePub({ plans: plansOf().map(p => p.id === f.dataset.id ? { ...p, ...item } : p) }); pedit = null; }
      renderEvent();
      if (f.dataset.pf === 'plan-add') { const t = document.querySelector('form[data-pf="plan-add"] [name=time]'); if (t) t.focus(); }
      return;
    }
    if (f.dataset.pf === 'wx-search') {
      const q = f.q.value.trim(); if (!q) return;
      wxErr = ''; try { wxPick = await WX.search(q); if (!wxPick.length) wxErr = `"${q}"을(를) 찾지 못했어요. 시·군 이름으로 찾아 주세요.`; } catch (e) { wxPick = []; wxErr = '찾지 못했어요. 인터넷 연결을 확인해 주세요.'; }
      renderEvent(); return;
    }
    await packSubmit(f); } catch (e) { console.error(e); toast('문제가 생겼어요. 잠시 뒤 다시 해 주세요'); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (pq || pdel || zdel)) { pq = null; pdel = null; zdel = null; rerenderPack(); } });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.ptime !== undefined) { const d = t.value.replace(/\D/g, '').slice(0, 4); t.value = d.length === 4 ? d.slice(0, 2) + ':' + d.slice(2) : d; return; }
  if (hdraft) {
    if (t.dataset.hd) hdraft[t.dataset.hd] = t.value;
    if (t.dataset.hi !== undefined) { const q = hdraft.questions[Number(t.dataset.hi)]; if (t.dataset.hf === 'text') q.text = t.value; if (t.dataset.hf === 'options') q.options = t.value.split('\n'); }
    if (t.dataset.hf !== 'type') return;
  }
  if (cdraft && t.dataset.ci !== undefined) { cdraft[Number(t.dataset.ci)][t.dataset.cf] = t.value; return; }
  if (rdraft) {
    if (t.dataset.ri !== undefined) rdraft.slots[Number(t.dataset.ri)][t.dataset.rf] = t.value;
    if (t.id === 'rl-total') rdraft.total = t.value; if (t.id === 'rl-before') rdraft.before = t.value; if (t.id === 'rl-after') rdraft.after = t.value;
    return;
  }
  if (ldraft && t.dataset.lc !== undefined) {
    const c = ldraft.cats[Number(t.dataset.lc)];
    if (t.dataset.lf === 'leave') c.leave = t.checked; else c[t.dataset.lf] = t.value;
    return;
  }
  if (!draft) {
    if (t.id === 't-n' || t.id === 't-side') $('#t-due').textContent = fmt(addDays(parseD(cur.date), taskOffset())) + '까지';
    return;
  }
  if (t.dataset.f === 'title') draft.title = t.value;
  if (t.dataset.qi !== undefined) {
    const q = draft.questions[Number(t.dataset.qi)], f = t.dataset.qf;
    if (f === 'text') q.text = t.value;
    if (f === 'options') q.options = t.value.split('\n');
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.name === 'itarget') { const n = $('#inew'); if (n) n.hidden = t.value !== 'new'; return; }
  if (t.id === 't-side') { $('#t-due').textContent = fmt(addDays(parseD(cur.date), taskOffset())) + '까지'; return; }
  if (hdraft && t.dataset.hf === 'type') {
    const q = hdraft.questions[Number(t.dataset.hi)]; q.type = t.value;
    if (q.type === 'choice' && !q.options) q.options = ['', '']; renderSheetForm(); return;
  }
  if (draft && t.dataset.qf === 'type') {
    const q = draft.questions[Number(t.dataset.qi)];
    q.type = t.value;
    if (q.type === 'choice' && !q.options) q.options = ['', ''];
    renderSurveyForm();
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#ov').classList.contains('show')) closeModal(); });
</script>
