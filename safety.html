<style>
  :root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF;
  --acc:#D9A23A; --acc-soft:#FBF1DC; --acc-ink:#7A5310;
  --brown:#A8693A; --brown-soft:#F6EADF;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3;
  --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .top{background:var(--pri);color:var(--on-pri);border-radius:20px;padding:22px 20px;margin-bottom:16px}
  .top .ev{font-size:14px;opacity:.85}
  .top h1{margin:4px 0 8px;font-size:24px;font-weight:900}
  .top p{margin:0;font-size:14px;opacity:.9}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px}
  .step{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .link{display:block;text-align:center;background:var(--pri-soft);color:var(--pri);font-weight:700;border-radius:12px;padding:14px;text-decoration:none;margin-bottom:10px}
  .vblock{margin-bottom:12px}
  .wbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .wbar i{display:block;height:100%;background:var(--acc);transition:.3s}
  .wbar i.ok{background:var(--ok)}
  .wtxt{font-size:13px;color:var(--sub);margin-top:5px}
  .wtxt.ok{color:var(--ok);font-weight:700}
  .conf{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:15px;font-weight:700}
  .conf input{width:22px;height:22px;accent-color:var(--ok)}
  .memo{font-size:14px;color:var(--sub);margin:0}
  .places{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pl{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
  .pl.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700;color:var(--pri)}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
  .num{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink)}
  .num.on{border-color:var(--pri);background:var(--pri);color:var(--on-pri)}
  .num:disabled{background:var(--soft);color:var(--sub);border-color:var(--soft);cursor:default;text-decoration:line-through}
  .hint{font-size:13px;color:var(--sub);margin-top:8px}
  .submit{width:100%;border:0;background:var(--pri);color:var(--on-pri);font:inherit;font-weight:900;font-size:19px;padding:16px;border-radius:16px;cursor:pointer;margin-top:4px}
  .submit:disabled{opacity:.5;cursor:default}
  .err{color:var(--warn);text-align:center;font-size:14px;margin-top:10px;min-height:20px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 22px;text-align:center;margin-top:30px}
  .msg .big{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
  .msg h2{margin:0 0 8px;font-size:22px}
  .msg p{margin:0;color:var(--sub)}
  .done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));color:var(--ok);font-weight:700;text-align:center}

body{font-family:var(--f-body)!important;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 360px) no-repeat,var(--bg)!important}
.top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#1d3a18))!important;color:var(--on-pri)!important;border-radius:24px!important;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;background:url(icon-180.png) center/cover;border-radius:24px;opacity:.22;transform:rotate(-10deg)}
.top h1{font-family:var(--f-display);font-weight:400!important;font-size:30px!important;line-height:1.2}
.card,.q,.grp,.msg{border-radius:22px!important;box-shadow:0 4px 16px var(--shadow)}
h2{font-family:var(--f-display);font-weight:400!important}
.msg h2,.card h2{font-size:22px!important}
.step{font-family:var(--f-body)}
.num,.nums button{font-family:var(--f-mono)!important;font-weight:500!important}
.submit,.big,.send{border-radius:999px!important;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 25%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<body>
<main id="app"><div class="msg"><p>안전 교육을 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=1.3.1"></script>
<script src="store.js?v=1.2.0"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLACES = { home: '집에서 가족과', class: '교실에서', alone: '혼자서' };
const p = new URLSearchParams(location.search);
const eid = p.get('e'), sid = p.get('s');
const KEY = 'fieldcheck-safety-' + eid + '-' + sid;
let uid = null, sf = null, taken = new Set(), place = '', num = 0, cls = '', mine = null, classes = [];
try { mine = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}
function ytId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === 'youtu.be') return x.pathname.slice(1).split('/')[0];
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(x.hostname)) {
      if (x.searchParams.get('v')) return x.searchParams.get('v');
      const m = x.pathname.match(/\/(shorts|embed|live)\/([^/?]+)/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
}

async function boot() {
  if (!eid || !sid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    uid = await S.studentLogin();
    step = '안전 교육 읽기';
    sf = await S.getSafety(eid, sid);
    if (!sf) return message('?', '안전 교육을 찾을 수 없어요', '선생님께 QR을 다시 확인해 달라고 해 주세요.');
    step = '번호 확인';
    classes = sf.classes && Object.keys(sf.classes).length
      ? Object.entries(sf.classes).map(([id, c]) => ({ id, ...c })).sort((a, b) => (a.order || 0) - (b.order || 0))
      : [{ id: 'c1', name: '우리 반', total: sf.total || 25 }];
    if (classes.length === 1) cls = classes[0].id;
    if (mine && !mine.c) mine.c = classes[0].id;
    taken = new Set((await S.listViews(eid, sid)).map(v => (v.c || classes[0].id) + '_' + Number(v.n)));
    render();
  } catch (e) {
    console.error(e);
    message('!', '안전 교육을 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', step + ' / ' + (e && (e.code || e.message) || '알 수 없음'));
  }
}

// ---- 영상 시청 확인 ----
// 유튜브 영상은 실제로 재생된 초만 셉니다. 앞으로 건너뛴 부분은 들어가지 않아요.
const NEED = 0.9;
const requireWatch = () => sf.requireWatch !== false;
let vids = [];   // {url, yt, watched:Set, dur, pct, confirmed, player, failed}
const vKey = i => KEY + '-v' + i;
function loadWatched(i) { try { return new Set(JSON.parse(localStorage.getItem(vKey(i))) || []); } catch (e) { return new Set(); } }
function saveWatched(v, i) { try { localStorage.setItem(vKey(i), JSON.stringify([...v.watched])); } catch (e) {} }
const cName = id => (classes.find(c => c.id === id) || {}).name || '';
const who = (c, n) => `${classes.length > 1 ? cName(c) + ' ' : ''}${n}번`;
const vidOk = v => !requireWatch() || (v.yt && !v.failed ? v.pct >= NEED : v.confirmed);
const allWatched = () => vids.every(vidOk);

function render() {
  document.title = sf.title;
  vids = sf.videos.map((url, i) => ({ url, yt: ytId(url), watched: loadWatched(i), dur: 0, pct: 0, confirmed: false, failed: false }));
  const blocks = vids.map((v, i) => {
    const label = vids.length > 1 ? `영상 ${i + 1}` : '영상';
    const linkBox = `<a class="link" href="${esc(v.url)}" target="_blank" rel="noopener">${label} 보러 가기</a>`;
    return `<div class="vblock" id="vb-${i}">
      ${v.yt ? `<div class="vid"><div id="pl-${i}"></div></div>` : linkBox}
      <div class="vstat" id="vs-${i}"></div></div>`;
  }).join('');
  app.innerHTML = `
    <div class="top"><div class="ev">${esc(sf.eventTitle || '')}</div><h1>${esc(sf.title)}</h1>
      <p>영상을 끝까지 보고, 아래에서 시청 체크를 해 주세요.</p></div>
    <div class="card"><span class="step">1단계</span><h2>영상을 끝까지 봐요</h2>${blocks}
      ${sf.planText ? `<p class="memo">${esc(sf.planText)}</p>` : ''}${sf.memo ? `<p class="memo">${esc(sf.memo)}</p>` : ''}</div>
    <div id="check"></div>`;
  vids.forEach((v, i) => updateVid(i));
  renderCheck();
  if (vids.some(v => v.yt)) loadYT();
}

function updateVid(i) {
  const v = vids[i], el = document.getElementById('vs-' + i);
  if (!el) return;
  if (!requireWatch()) { el.innerHTML = ''; return; }
  if (v.yt && !v.failed) {
    const pct = Math.min(100, Math.round(v.pct * 100));
    const ok = v.pct >= NEED;
    el.innerHTML = `<div class="wbar"><i style="width:${pct}%" class="${ok ? 'ok' : ''}"></i></div>
      <div class="wtxt ${ok ? 'ok' : ''}">${v.dur ? (ok ? `시청 ${pct}% · 다 봤어요` : `시청 ${pct}% · 90%를 넘게 보면 체크할 수 있어요`) : '재생 버튼을 눌러 영상을 봐 주세요'}</div>`;
  } else {
    el.innerHTML = `${v.failed ? '<div class="wtxt">이 영상은 여기서 재생할 수 없어서 시청 시간을 셀 수 없어요. 위 버튼으로 열어 봐 주세요.</div>' : '<div class="wtxt">이 영상은 시청 시간을 셀 수 없어요. 끝까지 본 뒤 아래에 체크해 주세요.</div>'}
      <label class="conf"><input type="checkbox" data-conf="${i}" ${v.confirmed ? 'checked' : ''}> 이 영상을 끝까지 봤어요</label>`;
    if (v.failed && v.yt && !document.querySelector('#vb-' + i + ' .link')) {
      document.querySelector('#vb-' + i + ' .vid').outerHTML = `<a class="link" href="${esc(v.url)}" target="_blank" rel="noopener">영상 보러 가기</a>`;
    }
  }
}

let ytLoading = false;
function loadYT() {
  if (ytLoading) return; ytLoading = true;
  window.onYouTubeIframeAPIReady = () => vids.forEach((v, i) => { if (v.yt) makePlayer(i); });
  const sc = document.createElement('script');
  sc.src = 'https://www.youtube.com/iframe_api';
  sc.onerror = () => ytFail();
  document.head.appendChild(sc);
  setTimeout(() => { if (!window.YT || !window.YT.Player) ytFail(); }, 10000);
}
function ytFail() {
  vids.forEach((v, i) => { if (v.yt && !v.player) { v.failed = true; updateVid(i); } });
  renderCheck();
}
function makePlayer(i) {
  const v = vids[i];
  v.player = new YT.Player('pl-' + i, {
    videoId: v.yt, host: 'https://www.youtube-nocookie.com',
    playerVars: { rel: 0, playsinline: 1, modestbranding: 1 },
    events: {
      onReady: () => { v.dur = Math.floor(v.player.getDuration() || 0); tick(i); },
      onError: () => { v.failed = true; updateVid(i); renderCheck(); },
    },
  });
}
// 0.25초마다 재생 중인 초를 기록 (2배속이어도 빠짐없이)
setInterval(() => vids.forEach((v, i) => {
  if (!v.player || v.failed || typeof v.player.getPlayerState !== 'function') return;
  if (v.player.getPlayerState() === 1) {
    const t = Math.floor(v.player.getCurrentTime());
    if (!v.dur) v.dur = Math.floor(v.player.getDuration() || 0);
    if (!v.watched.has(t)) { v.watched.add(t); if (v.watched.size % 5 === 0) saveWatched(v, i); }
    tick(i);
  }
}), 250);
function tick(i) {
  const v = vids[i];
  const before = vidOk(v);
  v.pct = v.dur ? v.watched.size / v.dur : 0;
  if (v.pct >= NEED) saveWatched(v, i);
  updateVid(i);
  if (vidOk(v) !== before) renderCheck();
}
window.addEventListener('pagehide', () => vids.forEach(saveWatched));

function renderCheck() {
  const box = document.getElementById('check');
  if (!box) return;
  let html;
  if (mine && taken.has(mine.c + '_' + mine.n)) {
    html = `<div class="card done">${who(mine.c, mine.n)}, 시청 체크를 마쳤어요. 고마워요!</div>
      ${sf.open ? '<button type="button" class="pl" id="another" style="width:100%">같은 휴대폰으로 다른 번호도 체크하기 (형제·자매)</button>' : ''}`;
  } else if (!sf.open) {
    html = `<div class="card done" style="background:var(--soft);color:var(--sub);border-color:var(--line)">시청 체크가 마감되었어요.</div>`;
  } else {
    const ready = allWatched();
    const cc = classes.find(c => c.id === cls);
    let nums = '';
    if (cc) for (let i = 1; i <= cc.total; i++) nums += `<button type="button" class="num ${num === i ? 'on' : ''}" data-n="${i}" ${taken.has(cls + '_' + i) ? 'disabled' : ''}>${i}</button>`;
    let label = classes.length > 1 ? '장소와 반, 번호를 골라 주세요' : '장소와 번호를 골라 주세요';
    if (!ready) label = '영상을 90% 넘게 보면 체크할 수 있어요';
    else if (place && cls && num) label = who(cls, num) + ', 다 봤어요';
    const clsPick = classes.length > 1 ? `<div class="places" style="grid-template-columns:repeat(auto-fill,minmax(80px,1fr));margin-bottom:12px">${classes.map(c => `<button type="button" class="pl ${cls === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : '';
    html = `
      <div class="card"><span class="step">2단계</span><h2>어디서 봤나요?</h2>
        <div class="places">${Object.entries(PLACES).map(([k, v]) => `<button type="button" class="pl ${place === k ? 'on' : ''}" data-p="${k}">${v}</button>`).join('')}</div></div>
      <div class="card"><span class="step">3단계</span><h2>${classes.length > 1 ? '내 반과 번호를 눌러 주세요' : '내 번호를 눌러 주세요'}</h2>
        ${clsPick}${cc ? `<div class="nums">${nums}</div>` : '<div class="hint">먼저 반을 골라 주세요.</div>'}
        <div class="hint">회색 번호는 이미 체크된 번호예요. 내 번호가 회색이면 선생님께 말씀드려요.</div></div>
      <button class="submit" id="submit" ${ready && place && cls && num ? '' : 'disabled'}>${label}</button>
      <div class="err" id="err"></div>`;
  }
  box.innerHTML = html;
}

app.addEventListener('change', ev => {
  const c = ev.target.closest('[data-conf]');
  if (c) { vids[Number(c.dataset.conf)].confirmed = c.checked; renderCheck(); }
});
app.addEventListener('click', async ev => {
  const pb = ev.target.closest('[data-p]');
  if (pb) { place = pb.dataset.p; renderCheck(); return; }
  const cb = ev.target.closest('[data-c]');
  if (cb) { cls = cb.dataset.c; num = 0; renderCheck(); return; }
  const nb = ev.target.closest('[data-n]');
  if (nb && !nb.disabled) { num = Number(nb.dataset.n); renderCheck(); return; }
  if (ev.target.id === 'another') { mine = null; place = ''; num = 0; if (classes.length > 1) cls = ''; renderCheck(); return; }
  if (ev.target.id === 'submit') {
    if (!allWatched()) return;
    const btn = ev.target; btn.disabled = true; btn.textContent = '보내는 중...';
    try {
      await S.addView(eid, sid, cls, num, place, uid);
      mine = { c: cls, n: num }; try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {}
      taken.add(cls + '_' + num); renderCheck();
    } catch (e) {
      console.error(e);
      if (String(e.message).includes('already')) {
        taken.add(cls + '_' + num); num = 0; renderCheck();
        document.getElementById('err').textContent = '방금 다른 사람이 그 번호를 체크했어요. 내 번호가 맞다면 선생님께 말씀드려요.';
      } else {
        btn.disabled = false; btn.textContent = who(cls, num) + ', 다 봤어요';
        document.getElementById('err').textContent = '보내지 못했어요. 마감되었거나 인터넷이 끊겼을 수 있어요.';
      }
    }
  }
});

boot();
</script>
</body>
</html>
