<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필드첵! 안전 교육</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--sub:#6b7487;--line:#e3e7ef;--pri:#2457d6;--pri-soft:#e9efff;--acc:#f5b301;--ok:#1f9d6b;--ok-soft:#e3f6ee;--warn:#d93f45}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.55}
  main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  .top{background:var(--pri);color:#fff;border-radius:20px;padding:22px 20px;margin-bottom:16px}
  .top .ev{font-size:14px;opacity:.85}
  .top h1{margin:4px 0 8px;font-size:24px;font-weight:900}
  .top p{margin:0;font-size:14px;opacity:.9}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px}
  .step{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
  .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .link{display:block;text-align:center;background:var(--pri-soft);color:var(--pri);font-weight:700;border-radius:12px;padding:14px;text-decoration:none;margin-bottom:10px}
  .memo{font-size:14px;color:var(--sub);margin:0}
  .places{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pl{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
  .pl.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700;color:var(--pri)}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
  .num{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink)}
  .num.on{border-color:var(--pri);background:var(--pri);color:#fff}
  .num:disabled{background:#eef0f4;color:#b3bac7;border-color:#eef0f4;cursor:default;text-decoration:line-through}
  .hint{font-size:13px;color:var(--sub);margin-top:8px}
  .submit{width:100%;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:900;font-size:19px;padding:16px;border-radius:16px;cursor:pointer;margin-top:4px}
  .submit:disabled{opacity:.5;cursor:default}
  .err{color:var(--warn);text-align:center;font-size:14px;margin-top:10px;min-height:20px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 22px;text-align:center;margin-top:30px}
  .msg .big{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
  .msg h2{margin:0 0 8px;font-size:22px}
  .msg p{margin:0;color:var(--sub)}
  .done{background:var(--ok-soft);border-color:#b9e6d3;color:var(--ok);font-weight:700;text-align:center}
</style>
</head>
<body>
<main id="app"><div class="msg"><p>안전 교육을 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLACES = { home: '집에서 가족과', class: '교실에서', alone: '혼자서' };
const p = new URLSearchParams(location.search);
const eid = p.get('e'), sid = p.get('s');
const KEY = 'fieldcheck-safety-' + eid + '-' + sid;
let uid = null, sf = null, taken = new Set(), place = '', num = 0, mine = null;
try { mine = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}
function ytId(u) {
  try {
    const x = new URL(u);
    if (x.hostname === 'youtu.be') return x.pathname.slice(1).split('/')[0];
    if (/(^|\.)youtube(-nocookie)?\.com$/.test(x.hostname)) {
      if (x.searchParams.get('v')) return x.searchParams.get('v');
      const m = x.pathname.match(/\/(shorts|embed|live)\/([^/?]+)/);
      if (m) return m[2];
    }
  } catch (e) {}
  return null;
}

async function boot() {
  if (!eid || !sid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    uid = await S.studentLogin();
    step = '안전 교육 읽기';
    sf = await S.getSafety(eid, sid);
    if (!sf) return message('?', '안전 교육을 찾을 수 없어요', '선생님께 QR을 다시 확인해 달라고 해 주세요.');
    step = '번호 확인';
    taken = new Set((await S.listViews(eid, sid)).map(v => Number(v.n)));
    render();
  } catch (e) {
    console.error(e);
    message('!', '안전 교육을 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', step + ' / ' + (e && (e.code || e.message) || '알 수 없음'));
  }
}

function render() {
  document.title = sf.title;
  const videos = sf.videos.map((v, i) => {
    const id = ytId(v);
    return id
      ? `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0" title="안전 교육 영상 ${i + 1}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
      : `<a class="link" href="${esc(v)}" target="_blank" rel="noopener">영상 ${sf.videos.length > 1 ? i + 1 + ' ' : ''}보러 가기</a>`;
  }).join('');
  let checkPart;
  if (mine && taken.has(mine.n)) {
    checkPart = `<div class="card done">${mine.n}번, 시청 체크를 마쳤어요. 고마워요!</div>
      ${sf.open ? '<button type="button" class="pl" id="another" style="width:100%">같은 휴대폰으로 다른 번호도 체크하기 (형제·자매)</button>' : ''}`;
  } else if (!sf.open) {
    checkPart = `<div class="card done" style="background:#eef0f4;color:var(--sub);border-color:var(--line)">시청 체크가 마감되었어요.</div>`;
  } else {
    let nums = '';
    for (let i = 1; i <= sf.total; i++) nums += `<button type="button" class="num ${num === i ? 'on' : ''}" data-n="${i}" ${taken.has(i) ? 'disabled' : ''}>${i}</button>`;
    checkPart = `
      <div class="card"><span class="step">2단계</span><h2>어디서 봤나요?</h2>
        <div class="places">${Object.entries(PLACES).map(([k, v]) => `<button type="button" class="pl ${place === k ? 'on' : ''}" data-p="${k}">${v}</button>`).join('')}</div></div>
      <div class="card"><span class="step">3단계</span><h2>내 번호를 눌러 주세요</h2>
        <div class="nums">${nums}</div>
        <div class="hint">회색 번호는 이미 체크된 번호예요. 내 번호가 회색이면 선생님께 말씀드려요.</div></div>
      <button class="submit" id="submit" ${place && num ? '' : 'disabled'}>${num ? num + '번, 다 봤어요' : '장소와 번호를 골라 주세요'}</button>
      <div class="err" id="err"></div>`;
  }
  app.innerHTML = `
    <div class="top"><div class="ev">${esc(sf.eventTitle || '')}</div><h1>${esc(sf.title)}</h1>
      <p>영상을 끝까지 보고, 아래에서 시청 체크를 해 주세요.</p></div>
    <div class="card"><span class="step">1단계</span><h2>영상을 끝까지 봐요</h2>${videos}
      ${sf.memo ? `<p class="memo">${esc(sf.memo)}</p>` : ''}</div>
    ${checkPart}`;
}

app.addEventListener('click', async ev => {
  const pb = ev.target.closest('[data-p]');
  if (pb) { place = pb.dataset.p; const y = scrollY; render(); scrollTo(0, y); return; }
  const nb = ev.target.closest('[data-n]');
  if (nb && !nb.disabled) { num = Number(nb.dataset.n); const y = scrollY; render(); scrollTo(0, y); return; }
  if (ev.target.id === 'another') { mine = null; place = ''; num = 0; render(); return; }
  if (ev.target.id === 'submit') {
    const btn = ev.target; btn.disabled = true; btn.textContent = '보내는 중...';
    try {
      await S.addView(eid, sid, num, place, uid);
      mine = { n: num }; try { localStorage.setItem(KEY, JSON.stringify(mine)); } catch (e) {}
      taken.add(num); render(); scrollTo(0, document.body.scrollHeight);
    } catch (e) {
      console.error(e);
      if (String(e.message).includes('already')) {
        taken.add(num); num = 0; render();
        document.getElementById('err').textContent = '방금 다른 사람이 그 번호를 체크했어요. 내 번호가 맞다면 선생님께 말씀드려요.';
      } else {
        btn.disabled = false; btn.textContent = num + '번, 다 봤어요';
        document.getElementById('err').textContent = '보내지 못했어요. 마감되었거나 인터넷이 끊겼을 수 있어요.';
      }
    }
  }
});

boot();
</script>
</body>
</html>
