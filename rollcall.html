<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D6B35">
<title>체험첵! 인원 점검</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF;
  --acc:#D9A23A; --acc-soft:#FBF1DC; --acc-ink:#7A5310;
  --brown:#A8693A; --brown-soft:#F6EADF;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3;
  --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
  main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  .top{background:var(--pri);color:var(--on-pri);border-radius:20px;padding:20px;margin-bottom:14px}
  .top .ev{font-size:14px;opacity:.85}
  .top h1{margin:4px 0 0;font-size:22px;font-weight:900}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
  .now{text-align:center}
  .now .lab{font-size:14px;color:var(--sub)}
  .now .ttl{font-size:24px;font-weight:900;margin:2px 0}
  .now .left{font-size:14px;color:var(--warn);font-weight:700}
  .big{width:100%;border:0;background:var(--ok);color:var(--on-pri);font:inherit;font-weight:900;font-size:22px;padding:20px;border-radius:18px;cursor:pointer;margin-top:14px}
  .big:disabled{opacity:.6}
  .link{background:none;border:0;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;margin-top:10px;cursor:pointer}
  .nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:12px}
  .num{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:var(--ink)}
  .num.on{border-color:var(--pri);background:var(--pri);color:var(--on-pri)}
  .num:disabled{background:var(--soft);color:var(--sub);border-color:var(--soft);cursor:default}
  .cls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .cbtn{flex:1;min-width:72px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
  .cbtn.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  .done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));text-align:center}
  .done .ck{font-size:44px;color:var(--ok);line-height:1}
  .done b{display:block;font-size:20px;color:var(--ok);margin-top:6px}
  .wait{text-align:center}
  .wait .ttl{font-size:20px;font-weight:900;margin:4px 0}
  .sch h2{font-size:15px;margin:0 0 6px;color:var(--sub)}
  .sch .row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .sch .row:first-of-type{border-top:0}
  .sch .t{font-weight:900;min-width:52px;color:var(--pri)}
  .sch .row.past{color:var(--sub)}.sch .row.past .t{color:var(--sub)}
  .sch .row.cur{font-weight:700}
  .hint{font-size:13px;color:var(--sub);margin-top:8px}
  .err{color:var(--warn);text-align:center;font-size:14px;margin-top:10px;min-height:20px}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 22px;text-align:center;margin-top:30px}
  .msg .bigt{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
  .msg h2{margin:0 0 8px;font-size:22px}
  .msg p{margin:0;color:var(--sub)}

body{font-family:var(--f-body)!important;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 360px) no-repeat,var(--bg)!important}
.top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#1d3a18))!important;color:var(--on-pri)!important;border-radius:24px!important;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;background:url(icon-180.png) center/cover;border-radius:24px;opacity:.22;transform:rotate(-10deg)}
.top h1{font-family:var(--f-display);font-weight:400!important;font-size:30px!important;line-height:1.2}
.card,.q,.grp,.msg{border-radius:22px!important;box-shadow:0 4px 16px var(--shadow)}
h2{font-family:var(--f-display);font-weight:400!important}
.msg h2,.card h2{font-size:22px!important}
.step{font-family:var(--f-body)}
.num,.nums button{font-family:var(--f-mono)!important;font-weight:500!important}
.submit,.big,.send{border-radius:999px!important;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 25%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"><div class="msg"><p>인원 점검을 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WK = '일월화수목금토';
const fmtD = s => { const [y, m, d] = s.split('-').map(Number); const dt = new Date(y, m - 1, d); return `${m}월 ${d}일(${WK[dt.getDay()]})`; };
const eid = new URLSearchParams(location.search).get('e');
const KEY = 'fieldcheck-roll-' + eid;
let uid = null, roll = null, marks = [], myC = '', myNum = 0, pickC = '', pick = 0, changing = false, busy = false, classes = [];
try { const m = JSON.parse(localStorage.getItem(KEY)); if (m && m.n) { myC = m.c || ''; myNum = Number(m.n); } } catch (e) {}
function saveMine() { try { localStorage.setItem(KEY, JSON.stringify({ c: myC, n: myNum })); } catch (e) {} }

function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="bigt">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}
const slots = () => Object.values(roll.slots).sort((a, b) => a.openAt - b.openAt);
const isOpen = s => Date.now() >= s.openAt && Date.now() <= s.closeAt;
const cOf = m => m.c || (classes[0] && classes[0].id);
const marked = (slot, c, n) => marks.some(m => m.slot === slot && cOf(m) === c && Number(m.n) === n);
const cName = id => (classes.find(c => c.id === id) || {}).name || '';
const who = (c, n) => `${classes.length > 1 ? cName(c) + ' ' : ''}${n}번`;
function until(ms) {
  const m = Math.max(0, Math.round(ms / 60000));
  if (m < 60) return `${m}분`;
  const h = Math.floor(m / 60), r = m % 60;
  return h < 24 ? `${h}시간${r ? ' ' + r + '분' : ''}` : `${Math.floor(h / 24)}일 ${h % 24}시간`;
}

async function boot() {
  if (!eid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    uid = await S.studentLogin();
    step = '점검 시간 읽기';
    roll = await S.getRoll(eid);
    if (!roll) return message('?', '인원 점검을 찾을 수 없어요', '선생님께 QR을 다시 확인해 달라고 해 주세요.');
    classes = roll.classes && Object.keys(roll.classes).length
      ? Object.entries(roll.classes).map(([id, c]) => ({ id, ...c })).sort((a, b) => (a.order || 0) - (b.order || 0))
      : [{ id: 'c1', name: '우리 반', total: roll.total || 25 }];
    if (!myC && myNum) myC = classes[0].id;
    const mc = classes.find(c => c.id === myC);
    if (!mc || myNum > mc.total) { myC = ''; myNum = 0; }
    if (classes.length === 1) pickC = classes[0].id;
    step = '체크 확인';
    S.watchMarks(eid, m => { marks = m; if (!busy) render(); }, e => console.error(e));
    render();
    setInterval(() => { if (!busy) render(); }, 20000);
  } catch (e) {
    console.error(e);
    message('!', '인원 점검을 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', step + ' / ' + (e && (e.code || e.message) || '알 수 없음'));
  }
}

function render() {
  document.title = roll.eventTitle + ' 인원 점검';
  const list = slots(), open = list.filter(isOpen), next = list.find(s => Date.now() < s.openAt);
  let main = '';
  if (open.length) {
    const s = open[0];
    const head = `<div class="lab">지금 점검 중</div><div class="ttl">${esc(s.time)} ${esc(s.label)}</div><div class="left">${until(s.closeAt - Date.now())} 안에 체크해 주세요</div>`;
    if (myNum && marked(s.id, myC, myNum) && !changing) {
      main = `<div class="card done"><div class="ck">✓</div><b>${who(myC, myNum)}, 확인됐어요!</b><div class="hint">${esc(s.time)} ${esc(s.label)}</div>
        <button class="link" id="change">내 번호가 아니에요</button></div>`;
    } else if (myNum && !changing) {
      main = `<div class="card now">${head}
        <button class="big" id="here">${who(myC, myNum)}, 저 여기 있어요!</button>
        <button class="link" id="change">내 번호가 아니에요</button><div class="err" id="err"></div></div>`;
    } else {
      main = `<div class="card now">${head}</div>
        <div class="card"><b>${classes.length > 1 ? '내 반과 번호를 눌러 주세요' : '내 번호를 눌러 주세요'}</b>${pickerBody(s.id)}
          <div class="hint">한 번 고르면 다음 점검부터는 버튼 하나만 누르면 돼요. 회색 번호는 이미 확인된 번호예요.</div>
          <button class="big" id="here" ${pickC && pick ? '' : 'disabled'}>${pickC && pick ? who(pickC, pick) + ', 저 여기 있어요!' : (classes.length > 1 ? '반과 번호를 골라 주세요' : '번호를 골라 주세요')}</button>
          <div class="err" id="err"></div></div>`;
    }
  } else if (next) {
    main = `<div class="card wait"><div class="hint" style="margin:0">다음 점검</div>
      <div class="ttl">${esc(next.time)} ${esc(next.label)}</div>
      <div class="hint" style="margin:0">${fmtD(next.date)} · ${until(next.openAt - Date.now())} 뒤에 열려요</div>
      ${myNum ? `<div class="hint">내 번호: ${who(myC, myNum)} <button class="link" id="change" style="margin:0">바꾸기</button></div>` : ''}</div>`;
    if (changing) main += numberPicker();
  } else {
    main = `<div class="card wait"><div class="ttl">모든 점검이 끝났어요</div><div class="hint" style="margin:0">함께해 주어서 고마워요.</div></div>`;
  }
  const days = {};
  list.forEach(s => { (days[s.date] = days[s.date] || []).push(s); });
  const sch = Object.keys(days).sort().map(d => `<div class="card sch"><h2>${fmtD(d)}</h2>${days[d].map(s => {
    const cls = isOpen(s) ? 'cur' : Date.now() > s.closeAt ? 'past' : '';
    const me = myNum && marked(s.id, myC, myNum) ? ' · 확인' : '';
    return `<div class="row ${cls}"><span class="t">${esc(s.time)}</span><span>${esc(s.label)}${me}</span></div>`;
  }).join('')}</div>`).join('');
  app.innerHTML = `<div class="top"><div class="ev">인원 점검</div><h1>${esc(roll.eventTitle)}</h1></div>${main}${sch}`;
}
function pickerBody(slotId) {
  const chips = classes.length > 1 ? `<div class="cls">${classes.map(c => `<button type="button" class="cbtn ${pickC === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div>` : '';
  const cc = classes.find(c => c.id === pickC);
  let nums = '';
  if (cc) for (let i = 1; i <= cc.total; i++) nums += `<button type="button" class="num ${pick === i ? 'on' : ''}" data-n="${i}" ${slotId && marked(slotId, pickC, i) ? 'disabled' : ''}>${i}</button>`;
  return chips + (cc ? `<div class="nums">${nums}</div>` : '<div class="hint">먼저 반을 골라 주세요.</div>');
}
function numberPicker() {
  return `<div class="card"><b>${classes.length > 1 ? '내 반과 번호를 골라 주세요' : '내 번호를 골라 주세요'}</b>${pickerBody(null)}
    <button class="big" id="save" ${pickC && pick ? '' : 'disabled'} style="background:var(--pri)">${pickC && pick ? who(pickC, pick) + '으로 정하기' : '골라 주세요'}</button></div>`;
}

app.addEventListener('click', async ev => {
  const cb = ev.target.closest('[data-c]');
  if (cb) { pickC = cb.dataset.c; pick = 0; render(); return; }
  const nb = ev.target.closest('[data-n]');
  if (nb && !nb.disabled) { pick = Number(nb.dataset.n); render(); return; }
  if (ev.target.id === 'change') { changing = true; pick = 0; if (classes.length > 1) pickC = ''; render(); return; }
  if (ev.target.id === 'save') {
    myC = pickC; myNum = pick; changing = false; saveMine();
    pick = 0; render(); return;
  }
  if (ev.target.id === 'here') {
    const s = slots().find(isOpen);
    if (!s) return render();
    const useMine = myNum && !changing;
    const n = useMine ? myNum : pick, c = useMine ? myC : pickC;
    if (!n || !c) return;
    busy = true; ev.target.disabled = true; ev.target.textContent = '보내는 중...';
    try {
      await S.addMark(eid, s.id, c, n, 'student', uid);
      myC = c; myNum = n; changing = false; pick = 0; saveMine();
      marks = marks.concat([{ slot: s.id, c, n, src: 'student' }]);
      busy = false; render();
    } catch (e) {
      busy = false;
      console.error(e);
      const msg = String(e.message);
      if (msg.includes('already')) {
        if (useMine) { marks = marks.concat([{ slot: s.id, c, n }]); render(); return; }
        render(); document.getElementById('err').textContent = '그 번호는 이미 확인됐어요. 내 번호가 맞다면 선생님께 말씀드려요.';
      } else if (msg.includes('closed')) {
        render(); const el = document.getElementById('err'); if (el) el.textContent = '지금은 점검 시간이 아니에요. 휴대폰 시계가 맞는지도 확인해 주세요.';
      } else {
        render(); const el = document.getElementById('err'); if (el) el.textContent = '보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      }
    }
  }
});

boot();
</script>
</body>
</html>
