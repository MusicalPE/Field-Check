<script>
/* 카카오톡 안 브라우저는 구글 로그인이 막히고 저장이 불안정해서, 휴대폰 기본 브라우저로 넘김 */

  if (!/KAKAOTALK/i.test(navigator.userAgent)) return;
  try{ if (sessionStorage.getItem("kakao-out")) return; sessionStorage.setItem("kakao-out", "1"); }catch(e){}
  window.__kakaoOut = true;

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF;
  --acc:#D9A23A; --acc-soft:#FBF1DC; --acc-ink:#7A5310;
  --brown:#A8693A; --brown-soft:#F6EADF;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3;
  --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif;
  --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812;
  --acc:#F0BE5A; --acc-soft:#3A2F17; --acc-ink:#F0BE5A;
  --brown:#D99A68; --brown-soft:#3A2A1E;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420;
  --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
  main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  .top{background:var(--pri);color:var(--on-pri);border-radius:20px;padding:22px 20px;margin-bottom:16px}
  .top .ev{font-size:14px;opacity:.85}
  .top h1{margin:4px 0 8px;font-size:24px;font-weight:900}
  .top p{margin:0;font-size:14px;opacity:.9}
  .q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
  .q.miss{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
  .q .n{display:inline-block;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:13px;border-radius:999px;padding:2px 10px;margin-bottom:8px}
  .q .t{font-weight:700;margin-bottom:12px}
  .opt-note{font-size:13px;color:var(--sub);font-weight:400}
  .stars{display:flex;gap:6px;justify-content:space-between}
  .star{flex:1;aspect-ratio:1;max-width:68px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:30px;color:var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .star.on{color:var(--acc);border-color:var(--acc);background:var(--card)8e1}
  .star-cap{text-align:center;font-size:14px;color:var(--sub);margin-top:8px;min-height:21px}
  .choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
  .choice.on{border-color:var(--pri);background:var(--pri-soft);font-weight:700}
  textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--pri)}
  .submit{width:100%;border:0;background:var(--pri);color:var(--on-pri);font:inherit;font-weight:900;font-size:19px;padding:16px;border-radius:16px;cursor:pointer;margin-top:6px}
  .submit:disabled{opacity:.6}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 22px;text-align:center;margin-top:30px}
  .msg .big{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
  .msg h2{margin:0 0 8px;font-size:22px}
  .msg p{margin:0;color:var(--sub)}
  .err{color:var(--warn);text-align:center;font-size:14px;margin-top:10px;min-height:20px}

body{font-family:var(--f-body)!important;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 360px) no-repeat,var(--bg)!important}
.top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#1d3a18))!important;color:var(--on-pri)!important;border-radius:24px!important;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;background:url(icon-180.png) center/cover;border-radius:24px;opacity:.22;transform:rotate(-10deg)}
.top h1{font-family:var(--f-display);font-weight:400!important;font-size:30px!important;line-height:1.2}
.card,.q,.grp,.msg{border-radius:22px!important;box-shadow:0 4px 16px var(--shadow)}
h2{font-family:var(--f-display);font-weight:400!important}
.msg h2,.card h2{font-size:22px!important}
.step{font-family:var(--f-body)}
.num,.nums button{font-family:var(--f-mono)!important;font-weight:500!important}
.submit,.big,.send{border-radius:999px!important;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 25%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main id="app"><div class="msg"><p>설문을 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=1.2.0"></script>
<script src="store.js?v=1.2.0"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAR_CAP = ['', '별로였어요', '조금 아쉬웠어요', '보통이에요', '좋았어요', '최고였어요'];
const p = new URLSearchParams(location.search);
const eid = p.get('e'), sid = p.get('s');
let uid = null, sv = null, answers = {};

function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}

async function boot() {
  if (!eid || !sid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    uid = await S.studentLogin();
    step = '설문 읽기';
    sv = await S.getSurvey(eid, sid);
    step = '제출 확인';
    if (!sv) return message('?', '설문을 찾을 수 없어요', '선생님께 QR을 다시 확인해 달라고 해 주세요.');
    document.title = sv.title;
    if (!sv.open) return message('■', '설문이 마감되었어요', '참여해 주어서 고마워요.');
    if (await S.hasResponded(eid, sid, uid)) return message('✓', '이미 제출했어요', '이 기기에서는 한 번만 낼 수 있어요.');
    render();
  } catch (e) {
    console.error(e);
    const code = (step || '') + ' / ' + (e && (e.code || e.message) || '알 수 없음');
    message('!', '설문을 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', code);
  }
}

function render() {
  const qs = sv.questions.map((q, i) => {
    let body = '';
    if (q.type === 'star') {
      const v = answers[q.id] || 0;
      body = `<div class="stars">${[1,2,3,4,5].map(n =>
        `<button type="button" class="star ${n <= v ? 'on' : ''}" data-q="${q.id}" data-v="${n}" aria-label="${n}점">★</button>`).join('')}</div>
        <div class="star-cap">${STAR_CAP[v]}</div>`;
    } else if (q.type === 'choice') {
      body = q.options.map(o =>
        `<button type="button" class="choice ${answers[q.id] === o ? 'on' : ''}" data-q="${q.id}" data-v="${esc(o)}">${esc(o)}</button>`).join('');
    } else {
      body = `<textarea data-q="${q.id}" maxlength="500" placeholder="자유롭게 적어 주세요">${esc(answers[q.id] || '')}</textarea>`;
    }
    return `<section class="q" id="q-${q.id}"><span class="n">${i + 1}번</span>
      <div class="t">${esc(q.text)} ${q.type === 'text' ? '<span class="opt-note">(안 적어도 돼요)</span>' : ''}</div>${body}</section>`;
  }).join('');
  app.innerHTML = `
    <div class="top"><div class="ev">${esc(sv.eventTitle || '')}</div><h1>${esc(sv.title)}</h1>
      <p>이름은 묻지 않아요. 솔직하게 답해 주세요.</p></div>
    ${qs}
    <button class="submit" id="submit">제출하기</button>
    <div class="err" id="err"></div>`;
}

app.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-q]');
  if (b && b.tagName === 'BUTTON') {
    const q = sv.questions.find(x => x.id === b.dataset.q);
    answers[q.id] = q.type === 'star' ? Number(b.dataset.v) : b.dataset.v;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }
  if (ev.target.id === 'submit') submit();
});
app.addEventListener('input', ev => {
  if (ev.target.tagName === 'TEXTAREA') answers[ev.target.dataset.q] = ev.target.value;
});

async function submit() {
  document.querySelectorAll('.q.miss').forEach(x => x.classList.remove('miss'));
  const miss = sv.questions.filter(q => q.type !== 'text' && !answers[q.id]);
  if (miss.length) {
    miss.forEach(q => document.getElementById('q-' + q.id).classList.add('miss'));
    document.getElementById('err').textContent = '빨간 칸의 질문에 답해 주세요.';
    document.getElementById('q-' + miss[0].id).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = '보내는 중...';
  const clean = {};
  sv.questions.forEach(q => {
    const v = answers[q.id];
    if (v !== undefined && v !== '') clean[q.id] = typeof v === 'string' ? v.trim().slice(0, 500) : v;
  });
  try {
    await S.submitResponse(eid, sid, uid, clean);
    message('✓', '제출했어요, 고마워요!', '선생님이 여러분의 생각을 잘 읽어 볼게요.');
    window.scrollTo(0, 0);
  } catch (e) {
    console.error(e);
    if (String(e.message).includes('already')) return message('✓', '이미 제출했어요', '이 기기에서는 한 번만 낼 수 있어요.');
    btn.disabled = false; btn.textContent = '제출하기';
    document.getElementById('err').textContent = '보내지 못했어요. 설문이 마감되었거나 인터넷이 끊겼을 수 있어요.';
  }
}

boot();
</script>
</body>
</html>
