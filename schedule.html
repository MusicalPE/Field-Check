<script>
/* 카카오톡 안 브라우저는 구글 로그인이 막히고 저장이 불안정해서, 휴대폰 기본 브라우저로 넘김 */

  if (!/KAKAOTALK/i.test(navigator.userAgent)) return;
  try{ if (sessionStorage.getItem("kakao-out")) return; sessionStorage.setItem("kakao-out", "1"); }catch(e){}
  window.__kakaoOut = true;
  location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
})();

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F6EF; --card:#FFFFFF; --soft:#F6F8F2; --ink:#232C22; --sub:#5F6E5B; --line:#DCE6D4;
  --pri:#3D6B35; --pri-soft:#E8F0E2; --on-pri:#FFFFFF; --acc:#D9A23A; --brown:#A8693A;
  --ok:#2E8B57; --ok-soft:#E1F3E8; --warn:#C94A35; --warn-soft:#FBE7E3; --sky:#A9D6DC; --shadow:rgba(61,107,53,.08);
  --f-display:"Do Hyeon","Noto Sans KR",sans-serif; --f-body:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121812; --card:#1A231A; --soft:#1F2A1F; --ink:#E3ECE0; --sub:#9DB09A; --line:#2C3A2B;
  --pri:#8CC27C; --pri-soft:#243523; --on-pri:#121812; --acc:#F0BE5A; --brown:#D99A68;
  --ok:#6FCB95; --ok-soft:#1D3527; --warn:#EE8470; --warn-soft:#3D2420; --sky:#1F3A3E; --shadow:rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 40%,var(--bg)) 0,var(--bg) 360px) no-repeat,var(--bg)}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.top{background:linear-gradient(135deg,var(--pri),color-mix(in srgb,var(--pri) 70%,#1d3a18));color:var(--on-pri);border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 10px 26px var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-14px;bottom:-18px;width:96px;height:96px;background:url(icon-180.png) center/cover;border-radius:24px;opacity:.22;transform:rotate(-10deg)}
.top .ev{font-size:14px;opacity:.85}
.top h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:4px 0 0;line-height:1.2}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px var(--shadow)}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 10px;color:var(--pri)}
h2 small{font-family:var(--f-body);font-size:13px;color:var(--sub)}
.mdays{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.mday{border:1.5px solid var(--line);background:var(--soft);color:var(--sub);font:inherit;font-size:14px;font-weight:800;border-radius:999px;padding:7px 14px;cursor:pointer}
.mday span{font-weight:400;font-size:12px;margin-left:4px}
.mday[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.plist li.now{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));box-shadow:inset 4px 0 0 var(--ok)}
.plist li.done{opacity:.6}
.ptime{flex:none;font-family:var(--f-mono);font-size:15px;color:var(--on-pri);background:var(--pri);border-radius:8px;padding:3px 8px}
.mtxt{display:flex;flex-direction:column;gap:2px;word-break:keep-all}
.mtxt b{font-size:16px}
.mtxt span{font-size:13.5px;color:var(--sub)}
.nowtag{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--ok);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:2px}
.empty{color:var(--sub);text-align:center;padding:14px;border:1px dashed var(--line);border-radius:14px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 22px;text-align:center;margin-top:30px}
.msg .big{font-size:52px;line-height:1;margin-bottom:12px;color:var(--pri)}
.msg h2{margin:0 0 8px;font-size:24px;color:var(--ink)}
.msg p{margin:0;color:var(--sub)}
</style>
</head>
<body>
<main id="app"><div class="msg"><p>일정표를 불러오는 중이에요...</p></div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="wx.js"></script>
<script>
const S = window.Store;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WK = '일월화수목금토';
const eid = new URLSearchParams(location.search).get('e');
let pub = null, day = 1, wx = null, wxMsg = '';
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
function days() {
  const out = [], a = parseD(pub.date), b = parseD(pub.endDate || pub.date);
  for (let d = new Date(a); d <= b && out.length < 14; d.setDate(d.getDate() + 1)) out.push(WX.ymd(d));
  return out;
}
const fmtD = s => { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일(${WK[d.getDay()]})`; };
function message(big, title, text, code) {
  app.innerHTML = `<div class="msg"><div class="big">${big}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${code ? `<p style="margin-top:14px;font-size:12px">오류 코드: ${esc(code)}</p>` : ''}</div>`;
}
async function boot() {
  if (!eid) return message('?', '주소가 올바르지 않아요', '선생님이 보여 준 QR을 다시 찍어 주세요.');
  let step = '로그인';
  try {
    await S.studentLogin();
    step = '일정 읽기';
    pub = await S.getPub(eid);
    if (!pub) return message('?', '아직 일정표가 없어요', '선생님이 일정을 올리면 이 화면에 나와요.');
    const td = days().indexOf(WX.ymd(new Date()));
    day = td >= 0 ? td + 1 : 1;
    render();
    if (pub.place) {
      try { wx = await WX.forecast(pub.place); } catch (e) { wxMsg = '날씨 예보를 불러오지 못했어요.'; }
      render();
    }
    setInterval(render, 60000);
  } catch (e) {
    console.error(e);
    message('!', '일정표를 열지 못했어요', '인터넷 연결을 확인하고 다시 열어 주세요.', step + ' / ' + (e && (e.code || e.message) || '알 수 없음'));
  }
}
function render() {
  document.title = pub.eventTitle + ' 일정표';
  const ds = days(), today = WX.ymd(new Date()), isToday = ds[day - 1] === today;
  const now = new Date(), nowT = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  const list = (pub.plans || []).filter(p => p.day === day).sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1);
  const curIdx = isToday ? list.reduce((k, p, i) => (p.time && p.time <= nowT ? i : k), -1) : -1;
  const past = ds[day - 1] < today;
  const rows = list.map((p, i) => `<li class="${i === curIdx ? 'now' : ''}${(isToday && i < curIdx) || past ? ' done' : ''}"><span class="ptime">${esc(p.time || '언제든')}</span>
    <div class="mtxt"><b>${esc(p.title)}${i === curIdx ? '<span class="nowtag">지금</span>' : ''}</b>${p.memo ? `<span>${esc(p.memo)}</span>` : ''}</div></li>`).join('');
  const end = parseD(pub.endDate || pub.date);
  const wxBox = pub.place && parseD(today) <= end
    ? `<div class="card"><h2>날씨 <small>${esc(pub.place.name)}</small></h2>${wx ? WX.table(ds, wx) : `<div style="color:var(--sub);font-size:14px">${esc(wxMsg || '날씨 예보를 불러오는 중이에요…')}</div>`}</div>` : '';
  app.innerHTML = `<div class="top"><div class="ev">${fmtD(pub.date)}${pub.endDate ? ' ~ ' + fmtD(pub.endDate) : ''}</div><h1>${esc(pub.eventTitle)} 일정표</h1></div>
    ${wxBox}
    <div class="card"><h2>일정</h2>
      ${ds.length > 1 ? `<div class="mdays">${ds.map((d, i) => `<button class="mday" data-d="${i + 1}" aria-pressed="${i + 1 === day}">${i + 1}일차<span>${parseD(d).getMonth() + 1}/${parseD(d).getDate()}${d === today ? ' 오늘' : ''}</span></button>`).join('')}</div>` : ''}
      <ul class="plist">${rows || '<li class="empty">이 날 일정이 아직 없어요.</li>'}</ul></div>`;
}
app.addEventListener('click', ev => { const b = ev.target.closest('.mday'); if (b) { day = Number(b.dataset.d); render(); } });
boot();
</script>
</body>
</html>
